<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GESTIÓN DE DESVIACIONES MATEC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --navy:#142E47; --navy-dark:#0d1f30; --blue:#2E74B5;
    --bg:#F5F7FA; --card:#FFFFFF; --border:#E2E8F0; --text:#1E293B; --muted:#64748B;
    --green:#15803d; --green-bg:#dcfce7; --amber:#92400e; --amber-bg:#fef3c7; --red:#b91c1c; --red-bg:#fee2e2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#142E47 0%,#1f4e79 55%,#e8eef5 55%);}
  .auth-card{width:100%;max-width:420px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(15,23,42,.18);padding:26px 24px;}
  .auth-card h2{margin:0 0 4px;font-size:19px;color:#142E47;}
  .auth-card .sub{color:#64748b;font-size:12.5px;margin-bottom:16px;}
  .auth-card .links{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:12.5px;}
  .auth-card .links a{color:#1d4ed8;text-decoration:none;}
  .auth-msg{border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px;}
  .auth-msg.err{background:#fee2e2;color:#b91c1c;} .auth-msg.ok{background:#dcfce7;color:#166534;} .auth-msg.info{background:#eff6ff;color:#1e40af;}
  .share-card{border-color:#93c5fd;background:#f8fbff;}
  .share-card code{background:#e2e8f0;border-radius:6px;padding:2px 8px;font-size:14px;letter-spacing:.04em;}
  a.btn{text-decoration:none;}
  .acc-badge{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13.5px;}

  .sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sidebar-brand{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
  .sidebar-brand .name{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.3;}
  .sidebar-brand .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 11px;font-size:13px;font-weight:500;color:#475569;}
  .nav button:hover{background:#f1f5f9;}
  .nav button.active{background:var(--navy);color:#fff;}
  .nav .icon{width:16px;height:16px;flex-shrink:0;}
  .sidebar-foot{padding:11px 18px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);}
  .db-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px;margin-top:6px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .topbar h1{font-size:15px;margin:0;color:#0f172a;}
  .topbar .cycle{font-size:11px;color:var(--muted);margin-top:3px;}
  .session{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .session select{border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:#fff;color:#334155;max-width:260px;}
  .role-pill{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#eef2ff;color:#3730a3;white-space:nowrap;}
  .content{flex:1;overflow-y:auto;padding:20px 22px 60px;}

  .mobile-nav{display:none;gap:6px;padding:10px 14px 0;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--border);}
  .mobile-nav button{border:none;background:#f1f5f9;color:#475569;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .mobile-nav button.active{background:var(--navy);color:#fff;}

  @media (max-width:860px){ .sidebar{display:none;} .mobile-nav{display:flex;} }
  @media (max-width:700px){ .two-col{grid-template-columns:1fr !important;} .row2,.row3{grid-template-columns:1fr !important;} }

  .grid{display:grid;gap:12px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .card h3{margin:0 0 10px;font-size:13.5px;color:#334155;}
  .kpi{display:flex;align-items:center;gap:11px;}
  .kpi .box{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .kpi .val{font-size:21px;font-weight:700;color:#0f172a;line-height:1.1;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);margin-top:1px;}

  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap;}
  .dot{width:6px;height:6px;border-radius:99px;background:currentColor;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input[type=text], .toolbar select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#94a3b8;}
  .search-wrap input{width:100%;padding-left:30px;}

  .list{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .row{padding:13px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:#f8fafc;}
  .row-top{display:flex;justify-content:space-between;gap:10px;}
  .row-title{font-weight:600;font-size:13.5px;color:#1e293b;}
  .row-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .row-badges{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
  .empty{padding:26px;text-align:center;color:#94a3b8;font-size:13px;}

  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-outline{background:#fff;border:1px solid var(--border);color:#334155;}
  .btn-outline:hover{background:#f8fafc;}
  .btn-danger-outline{background:#fff;border:1px solid #fecaca;color:#b91c1c;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-sm{padding:5px 9px;font-size:12px;}

  form .field{margin-bottom:14px;}
  form label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;}
  form .hint{font-size:11px;color:#94a3b8;margin-top:3px;}
  form input[type=text], form input[type=email], form input[type=date], form input[type=time], form input[type=password], form input[type=url],
  form input[type=datetime-local], form select, form textarea, form input[type=file]{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:#1e293b;
  }
  form textarea{resize:vertical;}
  fieldset{border:1px solid var(--border);border-radius:10px;padding:16px;margin:0 0 16px;}
  fieldset legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;}
  .radio-line{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 4px;}
  .radio-line input{width:auto;}

  .panel-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;justify-content:flex-end;}
  .panel{width:100%;max-width:680px;background:#fff;height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);}
  .panel-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2;}
  .panel-body{padding:18px 20px 40px;}
  .panel-close{border:none;background:#f1f5f9;border-radius:8px;padding:7px;color:#64748b;}

  .banner{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;}
  .banner-green{background:var(--green-bg);color:var(--green);}
  .banner-red{background:var(--red-bg);color:var(--red);}
  .banner-amber{background:var(--amber-bg);color:var(--amber);}
  .banner-slate{background:#f1f5f9;color:#475569;}

  .stage-track{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;}
  .stage-chip{font-size:10.5px;font-weight:600;padding:5px 8px;border-radius:6px;background:#f1f5f9;color:#cbd5e1;}
  .stage-chip.active{color:inherit;}
  .stage-chip.done{color:#15803d;background:#f0fdf4;}

  .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;margin:14px 0;}
  .kv .full{grid-column:1/-1;}
  .kv .k{font-size:11px;color:#94a3b8;margin-bottom:2px;}
  .kv .v{color:#1e293b;}

  .d8box{border:1px solid #fecaca;border-radius:10px;margin-top:16px;background:#fffafa;}
  .d8box-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;}
  .d8box-head h3{margin:0;font-size:13.5px;display:flex;align-items:center;gap:7px;color:#b91c1c;}
  .d8-field{padding:0 15px 12px;}
  .d8-field label{display:block;font-size:11.5px;font-weight:600;color:#475569;margin-bottom:4px;}
  .d8-field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;}

  .chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;color:#334155;border-radius:99px;padding:5px 10px 5px 12px;font-size:12px;margin:0 6px 6px 0;}
  .chip button{border:none;background:none;color:#94a3b8;font-size:13px;line-height:1;padding:0;}
  .type-add{display:flex;gap:8px;margin-top:8px;}
  .type-add input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 10px;}

  table.simple{width:100%;border-collapse:collapse;font-size:13px;}
  table.simple th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:#94a3b8;padding:8px 10px;border-bottom:1px solid var(--border);}
  table.simple td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:top;}

  .help h2{color:var(--navy);font-size:16px;margin:26px 0 10px;}
  .help h2:first-child{margin-top:0;}
  .help p{font-size:13.5px;line-height:1.65;color:#334155;}
  .help ol,.help ul{font-size:13.5px;line-height:1.75;color:#334155;padding-left:20px;}
  .callout{border-left:3px solid var(--blue);background:#eff6ff;border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:#1e3a5f;margin:12px 0;}
  .callout.warn{border-color:#f59e0b;background:#fffbeb;color:#78350f;}

  .hint{font-size:11px;color:#94a3b8;}
  .panel-body .field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;}
  .panel-body .field textarea,.panel-body .field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:#1e293b;font-size:13px;}
  .panel-body .field textarea:disabled,.panel-body .field select:disabled{background:#f8fafc;color:#64748b;}
  .tool-box{border:1px dashed #cbd5e1;border-radius:8px;padding:10px;margin-bottom:8px;background:#f8fafc;}
  .tool-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .tool-row{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:start;margin-bottom:6px;}
  .tool-row textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:13px;resize:vertical;}
  .act-row{display:grid;grid-template-columns:1.4fr 1.2fr 128px 1fr 34px;gap:6px;align-items:start;margin-bottom:6px;}
  .act-row input{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 7px;font-size:12.5px;background:#fff;}
  .act-head div{font-size:11px;font-weight:700;color:#475569;}
  .act-lbl{display:none;font-size:11px;font-weight:600;color:#475569;}
  @media (max-width:640px){ .act-row{grid-template-columns:1fr;border-bottom:1px dashed #cbd5e1;padding-bottom:6px;} .act-head{display:none;} .act-lbl{display:block;} }
  .flow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .flow-step{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;color:#334155;background:#f8fafc;}
  .flow-num{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  @media (max-width:760px){ .flow-grid{grid-template-columns:1fr;} }
  .paso8d{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fff;}
  .paso8d h3{margin:0 0 6px !important;color:var(--navy) !important;}
  .paso8d p{margin:4px 0 !important;}
  .ej{background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 8px 8px 0;padding:8px 12px;font-size:13px;color:#14532d;margin:6px 0;}
  .tool-q b{display:block;font-size:12px;color:#1e293b;}
  .tool-q span{font-size:11px;color:var(--muted);}
  @media (max-width:560px){ .tool-row{grid-template-columns:1fr;} }
  .adj-list{display:flex;flex-direction:column;gap:6px;margin:8px 0;}
  .adj-item{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:7px 10px;}
  .adj-item a{color:var(--blue);text-decoration:none;font-weight:600;}
  .sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){ .sign-grid{grid-template-columns:1fr;} }
  .sign-slot{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;}
  .sign-slot.mine{border-color:var(--blue);background:#f8fbff;grid-column:1/-1;}
  .sign-slot .role{font-size:11.5px;font-weight:700;color:#475569;margin-bottom:6px;}
  .sign-slot img{max-width:100%;max-height:90px;display:block;border:1px solid var(--border);border-radius:6px;background:#fff;}
  .help h3{font-size:14px;color:#1e293b;margin:18px 0 6px;}
  .help .steps li{margin-bottom:4px;}
  .benefit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0;}
  .benefit{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fbfcfe;}
  .benefit b{display:block;color:var(--navy);font-size:13px;margin-bottom:3px;}
  .benefit span{font-size:12.5px;color:#475569;line-height:1.5;}
  .bitacora{border-left:2px solid var(--border);margin-left:6px;padding-left:14px;}
  .bitacora-item{position:relative;padding-bottom:14px;}
  .bitacora-item::before{content:"";position:absolute;left:-19px;top:3px;width:8px;height:8px;border-radius:99px;background:var(--blue);}
  .bitacora-item .meta{font-size:11px;color:#94a3b8;}
  .bitacora-item .txt{font-size:13px;color:#334155;margin-top:2px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   ICONOS
   ============================================================ */
function icon(name){
  const paths = {
    dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
    plus: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    tag: '<path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
    chevronRight: '<polyline points="9 18 15 12 9 6"/>',
    alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
    clip: '<path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19L9.66 17.65a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    download: '<path d="M21 15v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    undo: '<path d="M3 7v6h6"/><path d="M3.51 13a9 9 0 1 0 2.13-9.36L3 7"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  };
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">${paths[name]||""}</svg>`;
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,8); }
function todayISO(offsetDays){ const d = new Date(); d.setDate(d.getDate() + (offsetDays||0)); return d.toISOString().slice(0,10); }
function nowLocal(){ return new Date().toISOString().slice(0,16); }
function nowStamp(){ return new Date().toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" }); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function setupSignaturePad(canvasId, hiddenInputId, clearBtnId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  let drawing = false, hasDrawn = false;
  const hidden = document.getElementById(hiddenInputId);

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function start(e){ drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function finish(){ if(!drawing) return; drawing = false; sync(); }
  function sync(){ if(hidden) hidden.value = hasDrawn ? canvas.toDataURL("image/png") : ""; }
  function clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; sync(); }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", finish);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", finish);

  const clearBtn = document.getElementById(clearBtnId);
  if(clearBtn) clearBtn.addEventListener("click", clear);
}

   ============================================================ */
// Cada etapa se aprueba con la firma de su responsable; al firmar, el registro pasa a la siguiente etapa.
const FIRMA_SLOTS = [
  {key:"sol",    stage:0,    rol:"Responsable del proceso", label:"1 · Solicitud — Responsable del proceso"},
  {key:"aprob",  stage:1,    rol:"Aprobador autorizado",    label:"2 · Evaluación y Aprobación — Aprobador autorizado"},
  {key:"cierre", stage:2,    rol:"Responsable del proceso", label:"3 · Cierre — Responsable del proceso que hizo la solicitud"},
  {key:"admin",  stage:null, rol:"Administrador",           label:"Visto bueno del Administrador (opcional)"},
];
function firmaSlotsFor(rec){ return FIRMA_SLOTS; }
function slotForStage(stage){ return FIRMA_SLOTS.find(sl => sl.stage === stage); }
function pendingSlots(rec){ if(isClosed(rec) || rec.borrador) return []; const sl = slotForStage(rec.stage); return sl && !rec.firmas[sl.key] ? [sl] : []; }

const MAX_FILE_MB = 5;      // tamaño máximo por archivo
const MAX_FILES_BATCH = 10; // archivos por cargue

// Completa y migra campos de registros antiguos o traídos de la base de datos.
// Modelo 3 (01/10/2026): ciclo Solicitud → Evaluación → Aprobación → Cierre, firmas sol/eval/aprob/cierre.
function normalizeRecord(r){
  const areaAnterior = r.area;
  r.area = migrateArea(r.area);
  if(r.area !== areaAnterior) r._migrado = true;
  if(!r.firmas || typeof r.firmas !== "object") r.firmas = {};
  if(!r.firmas.sol && r.firmas["Solicitante"]) r.firmas.sol = r.firmas["Solicitante"];
  if(!r.firmas.sol && r.firmaSolicitante){
    r.firmas.sol = { nombre: r.reportadoPor, usuarioId: r.reportadoPorId || "", dataUrl: String(r.firmaSolicitante).indexOf("data:image")===0 ? r.firmaSolicitante : "", fecha: r.firmaSolicitanteFecha || "" };
  }
  if(!r.modelo || r.modelo < 3){
    // Etapas del ciclo anterior (8): 0-3 → Evaluación, 4 → Aprobación, 5-6 → Cierre (pendiente), 7 → Cierre (cerrado)
    const old = typeof r.stage === "number" ? r.stage : 0;
    const f = r.firmas;
    const nf = { sol: f.sol };
    const ev = f.s3 || f.s1 || f.s0 || f["Responsable del proceso"]; if(ev) nf.eval = ev;
    const ap = f.s4 || f["Aprobador autorizado"] || (r.firmaAprobador ? { nombre: r.firmaAprobador, usuarioId:"", dataUrl:"", fecha: r.firmaAprobadorFecha || "" } : null); if(ap) nf.aprob = ap;
    const ci = f.s6 || f["Responsable de seguimiento"]; if(ci) nf.cierre = ci;
    if(f.admin || f["Administrador"]) nf.admin = f.admin || f["Administrador"];
    r.firmas = nf;
    if(old >= 7 || r.resultado === "Rechazada"){ r.cerrado = true; }
    if(!r.tema) r.tema = (r.relacionadoSST && r.area !== AREA_SST) ? AREA_SST : r.area;
    if(!r.conceptoEvaluacion) r.conceptoEvaluacion = [r.conceptoCalidad ? "Calidad: " + r.conceptoCalidad : "", r.conceptoSST ? "SST: " + r.conceptoSST : ""].filter(Boolean).join("\n");
    // valores en la numeración del modelo 3 (4 etapas): Evaluación=1, Aprobación=2, Cierre=3
    r.stage = old <= 3 ? 1 : old === 4 ? 2 : 3;
    r.modelo = 3; r._migrado = true;
  }
  if(r.modelo < 4){
    // Modelo 3 (Solicitud → Evaluación → Aprobación → Cierre) → modelo 4 (Solicitud → Evaluación y Aprobación → Cierre).
    // La evaluación ahora la hace el Aprobador autorizado y el cierre el Responsable del proceso que hizo la solicitud.
    const st = typeof r.stage === "number" ? r.stage : 1;
    r.stage = st >= 3 ? STAGE_CIERRE : STAGE_EVAL;
    if(r.firmas && r.firmas.eval){ r.firmas.evalAnterior = r.firmas.eval; delete r.firmas.eval; }
    if(!r.reportadoPorId && r.responsableProcesoId) { /* se conserva el creador original */ }
    r.modelo = MODELO_REGISTRO; r._migrado = true;
  }
  if(!r.tema) r.tema = r.area;
  r.relacionadoSST = r.area === AREA_SST || r.tema === AREA_SST; // "Solicitud relacionada con temas de" (restituido el 25/10/2026)
  if(r.relacionadoSST && !r.peligroSST && SST_PELIGROS.some(p => p.nombre === r.tipoEspecifico)) r.peligroSST = r.tipoEspecifico;
  if(r.cerrado === undefined) r.cerrado = false;
  ["responsableProceso","responsableProcesoId","conceptoEvaluacion","observacionesAprobacion"].forEach(k => { if(r[k] === undefined) r[k] = ""; });
  if(r.borrador === undefined) r.borrador = false;
  if(r.devuelta === undefined) r.devuelta = false;
  if(!Array.isArray(r.adjuntos)) r.adjuntos = [];
  r.adjuntos = r.adjuntos.map(a => typeof a === "string" ? { id: uid("f"), nombre: a, tipo: "", tamano: 0, dataUrl: "", fecha: "", usuario: "" } : a);
  if(!Array.isArray(r.bitacora)) r.bitacora = [];
  if(!r.d8) r.d8 = emptyD8();
  if(!r.d8.w2h) r.d8.w2h = emptyW2H();
  if(!Array.isArray(r.d8.whys)) r.d8.whys = ["","","","",""];
  if(!Array.isArray(r.d8.contencion) || !r.d8.contencion.length) r.d8.contencion = [emptyActRow("d3")];
  if(!Array.isArray(r.d8.correctivas) || !r.d8.correctivas.length) r.d8.correctivas = [emptyActRow("d5")];
  if(!r.resultado) r.resultado = "";
  if(!r.fechaCierre) r.fechaCierre = "";
  // Derogación temporal (rango de fechas) o definitiva (fecha a partir de la cual es permanente). 25/10/2026
  if(r.tipoGestion === "Derogación"){
    if(r.alcanceDerogacion !== "Definitiva" && r.alcanceDerogacion !== "Temporal") r.alcanceDerogacion = "Temporal";
    if(r.alcanceDerogacion === "Definitiva"){ if(!r.fechaEfectiva) r.fechaEfectiva = r.vigenciaInicio || ""; r.vigenciaFin = ""; }
  } else { r.alcanceDerogacion = ""; }
  if(r.fechaEfectiva === undefined) r.fechaEfectiva = "";
  if(r.temaOtro === undefined) r.temaOtro = false;
  if(r.tipoEspecificoOtro === undefined) r.tipoEspecificoOtro = false;
  return r;
}
records.forEach(r => { normalizeRecord(r); delete r._migrado; });
// Valor especial de las listas desplegables para escribir una opción que no está en la lista.
const OTRO = "__otro__";
const OTRO_LABEL = "Otro (escribir)";
// Texto de la vigencia según la figura: desviación (rango), derogación temporal (rango) o definitiva (fecha efectiva).
function esDefinitiva(r){ return r.tipoGestion === "Derogación" && r.alcanceDerogacion === "Definitiva"; }
function vigenciaTexto(r){
  if(esDefinitiva(r)) return "Definitiva — efectiva de forma permanente desde " + (r.fechaEfectiva || r.vigenciaInicio || "—");
  const rango = (r.vigenciaInicio || "—") + " a " + (r.vigenciaFin || "—");
  return r.tipoGestion === "Derogación" ? "Temporal — del " + rango : rango;
}
function migrateUser(u){
  const m = ROLE_MIGRATION[u.rol];
  if(!m) return false;
  u.rol = m.rol; if(m.area && !u.area) u.area = m.area;
  return true;
}

function fmtSize(bytes){
  if(!bytes) return "";
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1048576) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}
// Lee una lista de File y devuelve objetos de adjunto con el contenido en dataURL.
function readFilesAsAttachments(fileList){
  const files = Array.from(fileList || []);
  const rechazados = files.filter(f => f.size > MAX_FILE_MB*1048576).map(f => f.name);
  const validos = files.filter(f => f.size <= MAX_FILE_MB*1048576);
  const u = currentUser();
  const lecturas = validos.map(f => new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => resolve({ id: uid("f"), nombre: f.name, tipo: f.type || "", tamano: f.size, dataUrl: fr.result, fecha: new Date().toISOString().slice(0,16).replace("T"," "), usuario: u.nombre });
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(f);
  }));
  return Promise.all(lecturas).then(list => ({ adjuntos: list.filter(Boolean), rechazados }));
}
function attachmentListHTML(adjuntos, opts){
  opts = opts || {};
  if(!adjuntos || !adjuntos.length) return `<p class="hint" style="margin:4px 0;">${esc(opts.emptyText || "Sin archivos adjuntos.")}</p>`;
  return `<div class="adj-list">${adjuntos.map(a => `
    <div class="adj-item">
      <span style="display:flex;align-items:center;gap:6px;min-width:0;">${icon("clip")}
        ${a.dataUrl ? `<a href="${a.dataUrl}" download="${esc(a.nombre)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.nombre)}</a>` : `<span>${esc(a.nombre)}</span>`}
        <span class="hint" style="white-space:nowrap;">${esc(fmtSize(a.tamano))}${a.usuario ? " · " + esc(a.usuario) : ""}${a.fecha ? " · " + esc(a.fecha) : ""}</span>
      </span>
      ${opts.removable ? `<button type="button" class="btn btn-danger-outline btn-sm" data-${opts.removable}="${a.id}" title="Quitar">${icon("x")}</button>` : ""}
    </div>`).join("")}</div>`;
}

// Se guarda el fragmento de la URL antes de que Supabase lo procese (enlace de recuperación de contraseña).
const URL_HASH_INICIAL = String(window.location.hash || "");
const DB_ENABLED = !!(window.SUPABASE_URL && window.SUPABASE_URL.indexOf("http") === 0 &&
  window.SUPABASE_KEY && window.SUPABASE_KEY.length > 20 && window.SUPABASE_KEY.indexOf("PEGA_AQUI") === -1);
const sb = (DB_ENABLED && window.supabase) ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY) : null;
let dbStatus = DB_ENABLED ? "conectando" : "local"; // "conectando" | "conectado" | "error" | "local"

let configTableOk = true; // false si falta la tabla "configuracion" (ejecutar supabase_schema.sql actualizado)
// Ingreso con usuario (correo) y contraseña mediante Supabase Auth. Sin base de datos, el aplicativo funciona en modo local.
const AUTH_ON = !!sb;
let authSession = null;
let appConfig = { url: "" }; // enlace de acceso que se comparte con los usuarios (Usuarios → Enlace de acceso)
function appUrl(){
  const conf = String(appConfig.url || "").trim();
  if(conf) return conf;
  return window.location.protocol.indexOf("http") === 0 ? window.location.origin + window.location.pathname : "";
}
function dbSaveAppConfig(){ if(DB_ENABLED && sb) sb.from("configuracion").upsert({id:"app", data: appConfig}).then(({error}) => { if(error){ console.error(error); alert("No se pudo guardar el enlace: " + error.message); } }); }
async function dbLoadAll(){
  try{
    const [r1, r2, r3] = await Promise.all([
      sb.from("registros").select("*"),
      sb.from("usuarios").select("*"),
      sb.from("tipos_desviacion").select("*"),
    ]);
    if (r1.error || r2.error || r3.error) throw (r1.error || r2.error || r3.error);

    // Áreas configurables (tabla "configuracion"); si no existe, se usan las áreas por defecto.
    const rcAll = await sb.from("configuracion").select("*");
    const rc = rcAll.error ? rcAll : { data: (rcAll.data || []).filter(x => x.id === "areas") };
    if(!rcAll.error){ const app = (rcAll.data || []).find(x => x.id === "app"); if(app && app.data) appConfig = Object.assign({ url: "" }, app.data); }
    if (rc.error){ configTableOk = false; console.warn("Tabla 'configuracion' no disponible:", rc.error.message); }
    else if (rc.data && rc.data.length && Array.isArray(rc.data[0].data.areas) && rc.data[0].data.areas.length){
      AREAS = rc.data[0].data.areas;
      // Se reincorpora una sola vez el área de Seguridad y Salud en el Trabajo con su estructura anterior.
      if(!rc.data[0].data.sstIncluida && !AREAS.includes(AREA_SST)){ AREAS.push(AREA_SST); }
      if(!rc.data[0].data.sstIncluida) dbSaveAreas();
    }
    else { dbSaveAreas(); }

    if (r2.data && r2.data.length){
      users = r2.data.map(row => row.data);
      users.forEach(u => { const a = migrateArea(u.area || ""); const cambioRol = migrateUser(u); if(a !== (u.area||"") || cambioRol){ u.area = migrateArea(u.area || ""); dbSaveUser(u); } });
    }
    else { await Promise.all(users.map(u => sb.from("usuarios").upsert({id:u.id, data:u}))); }

    if (r3.data && r3.data.length){
      const grouped = {}; AREAS.forEach(a => grouped[a] = []);
      r3.data.forEach(row => {
        const t = row.data;
        const area = migrateArea(row.area);
        if(area !== row.area) dbSaveType(area, t);
        if(!grouped[area]) grouped[area] = [];
        grouped[area].push(t);
      });
      // Áreas nuevas sin tipos en la base de datos: se cargan los tipos por defecto.
      AREAS.forEach(a => { if(!grouped[a].length && deviationTypes[a] && deviationTypes[a].length){ grouped[a] = deviationTypes[a]; deviationTypes[a].forEach(t => dbSaveType(a, t)); } });
      deviationTypes = grouped;
    } else {
      const inserts = [];
      AREAS.forEach(area => typesFor(area).forEach(t => inserts.push(sb.from("tipos_desviacion").upsert({id:t.id, area, data:t}))));
      await Promise.all(inserts);
    }

    if (r1.data && r1.data.length){
      records = r1.data.map(row => normalizeRecord(row.data));
      records.forEach(r => { if(r._migrado){ delete r._migrado; dbSaveRecord(r); } });
      records.sort((a,b) => b.id.localeCompare(a.id));
    }
    else { await Promise.all(records.map(r => sb.from("registros").upsert({id:r.id, data:r}))); }

    // Huella de registros eliminados (si la tabla no existe se avisa al Administrador)
    const re = await sb.from("registros_eliminados").select("*");
    if(re.error){ auditTableOk = false; console.warn("Tabla 'registros_eliminados' no disponible:", re.error.message); }
    else { auditTableOk = true; eliminados = (re.data || []).map(row => row.data).sort((a,b) => String(b.fechaISO).localeCompare(String(a.fechaISO))); }

    dbStatus = "conectado";
  }catch(err){
    console.error("Error de conexión con la base de datos:", err);
    dbStatus = "error";
  }
  render();
}
function typesFor(area){ if(!deviationTypes[area]) deviationTypes[area] = []; return deviationTypes[area]; }
function dbSaveAreas(){ if(DB_ENABLED && sb) sb.from("configuracion").upsert({id:"areas", data:{areas: AREAS, sstIncluida: true}}).then(({error}) => { if(error){ configTableOk = false; console.error(error); render(); } }); }
// Elimina un registro (solo Administrador) dejando huella: quién, cuándo, por qué y una copia del registro.
async function eliminarRegistroAdmin(id, motivo){
  const rec = records.find(r => r.id === id);
  const u = currentUser();
  if(!rec || !isAdmin()) return false;
  const copia = JSON.parse(JSON.stringify(rec));
  (copia.adjuntos || []).forEach(a => { if(a.dataUrl) { a.dataUrl = ""; a.contenidoOmitido = true; } }); // la copia conserva los datos del archivo, no su contenido
  const huella = {
    id: uid("del"), registroId: rec.id, tipoGestion: rec.tipoGestion, area: rec.area, tipoEspecifico: rec.tipoEspecifico,
    estado: estadoTexto(rec), reportadoPor: rec.reportadoPor,
    eliminadoPor: u.nombre, eliminadoPorId: u.id, eliminadoPorCorreo: u.correo, rol: u.rol,
    fecha: nowStamp(), fechaISO: new Date().toISOString(), motivo, restaurado: false, copia,
  };
  if(DB_ENABLED && sb){
    const { error } = await sb.from("registros_eliminados").insert({ id: huella.id, data: huella });
    if(error){ auditTableOk = false; alert("No se eliminó el registro: no se pudo guardar la huella de auditoría (" + error.message + "). Ejecute el archivo supabase_schema.sql actualizado en Supabase."); return false; }
    const del = await sb.from("registros").delete().eq("id", id);
    if(del.error){ alert("La huella quedó guardada, pero no se pudo eliminar el registro: " + del.error.message); return false; }
  }
  eliminados.unshift(huella);
  records = records.filter(r => r.id !== id);
  return true;
}
// Restaura un registro eliminado (queda constancia en su bitácora y en la huella).
function restaurarRegistro(huellaId){
  const h = eliminados.find(x => x.id === huellaId);
  if(!h || !isAdmin() || h.restaurado) return;
  if(records.some(r => r.id === h.registroId)){ alert("Ya existe un registro con el consecutivo " + h.registroId + "."); return; }
  const rec = normalizeRecord(JSON.parse(JSON.stringify(h.copia)));
  const u = currentUser();
  rec.bitacora.push({ etapa: STAGES[rec.stage] || "", rol: u.rol, usuario: u.nombre, fecha: todayISO(0), comentario: `Registro restaurado por ${u.nombre}. Había sido eliminado por ${h.eliminadoPor} el ${h.fecha} (motivo: ${h.motivo}). Los archivos adjuntos no se recuperan.` });
  records.unshift(rec); records.sort((a,b) => String(b.id).localeCompare(String(a.id)));
  dbSaveRecord(rec);
  h.restaurado = true; h.restauradoPor = u.nombre; h.restauradoEl = nowStamp();
  if(DB_ENABLED && sb) sb.from("registros_eliminados").upsert({ id: h.id, data: h }).then(({error}) => { if(error) console.error(error); });
  render();
}

// ¿Puede el usuario en sesión firmar este espacio de firma?
function canSignSlot(rec, slot){

  if(slot.key === "admin") return true;
  if(isClosed(rec) || rec.borrador) return false;
  if(slot.stage !== rec.stage) return false;                    // solo se firma la etapa en curso
  if(slot.key === "cierre" && !esDueno(u, rec)) return false;   // cierra quien hizo la solicitud
  return true;
}
// Requisitos de contenido para aprobar cada etapa (lista vacía = puede firmar).
function requisitosFirma(rec, slot){
  const falta = [];

  if(slot.key === "aprob"){
    if(!t(rec.conceptoEvaluacion)) falta.push("concepto de evaluación");
    if(!t(rec.controlesCompensatorios)) falta.push("medidas de control");
    if(rec.tipoGestion === "Derogación" && !is8DComplete(rec)) falta.push("reporte 8D completo (" + d8Faltantes(rec.d8).join("; ") + ")");
  }
  if(slot.key === "cierre"){
    if(!t(rec.observacionesCierre)) falta.push("observaciones de cierre");
    if(!t(rec.cumplimientoControl)) falta.push("cumplimiento de controles");
  }
  return falta;
}

// Lista de lo que falta en el 8D (vacía = completo). D2 exige las 7 preguntas del 5W2H; D4 exige los 3 primeros porqués y la causa raíz.
function d8Faltantes(d8){
  const falta = [];
  const t = v => String(v || "").trim().length > 0;
  ["d1","d4","d6","d7","d8"].forEach(k => { if(!t(d8[k])) falta.push(D8_FIELDS.find(f => f.key===k).label.split(" (")[0]); });
  const w = d8.w2h || {};
  const w2hFalt = W2H_FIELDS.filter(f => !t(w[f.key])).map(f => f.label);
  if(w2hFalt.length) falta.push("D2 · 5W2H (" + w2hFalt.join(", ") + ")");
  const whys = d8.whys || [];
  const whyFalt = []; for(let i=0;i<WHYS_REQUIRED;i++){ if(!t(whys[i])) whyFalt.push("Porqué " + (i+1)); }
  if(whyFalt.length) falta.push("D4 · 5 Porqués (" + whyFalt.join(", ") + ")");
  // D3 y D5: al menos una fila completa y ninguna fila a medias
  ["d3","d5"].forEach(kind => {
    const cfg = ACT_TABLES[kind], nom = kind.toUpperCase() + " · " + cfg.titulo;
    const filas = (d8[cfg.prop] || []).filter(r => cfg.cols.some(c => t(r[c.key])));
    if(!filas.length) falta.push(nom + " (registre al menos una)");
    filas.forEach((r, i) => { const fc = cfg.cols.filter(c => !t(r[c.key])).map(c => c.label); if(fc.length) falta.push(nom + " fila " + (i+1) + " (" + fc.join(", ") + ")"); });
  });
  return falta;
}
function is8DComplete(rec){
  if(rec.tipoGestion !== "Derogación") return true;
  return d8Faltantes(rec.d8).length === 0;
}

// Destinatario del aviso según la etapa en curso: Evaluación y Aprobación → Aprobador(es); Cierre → Responsable del proceso que hizo la solicitud.
function destinatariosEtapa(rec){
  const dueno = users.find(u => u.id === rec.reportadoPorId) || users.find(u => u.nombre === rec.reportadoPor);
  let list = [];
  if(rec.stage === STAGE_EVAL && !isClosed(rec)) list = users.filter(u => u.rol === "Aprobador autorizado");
  else list = [dueno];
  list = list.filter(Boolean);
  if(!list.length) list = users.filter(u => u.rol === "Administrador");
  return list;
}
function buildMailto(rec){

  const accion = rec.resultado === "Rechazada" ? "fue rechazada" : isClosed(rec) ? "fue cerrada" : rec.devuelta ? "fue devuelta para ajustes" : rec.stage === STAGE_EVAL ? "requiere su evaluación y aprobación" : "está aprobada; ciérrela cuando finalice la actividad";
  const subject = `${rec.tipoGestion} ${rec.id} — ${STAGES[rec.stage]} — ${rec.area}`;

    ...(rec.tipoGestion === "Derogación" ? [`Alcance: ${vigenciaTexto(rec)}`] : []),

/* ============================================================
   INGRESO CON USUARIO Y CONTRASEÑA (Supabase Auth)
   ============================================================ */
function traducirErrorAuth(err){
  const m = String((err && err.message) || err || "");
  if(/invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if(/email not confirmed/i.test(m)) return "Debe confirmar su correo antes de ingresar (revise el mensaje de confirmación enviado por Supabase).";
  if(/already registered|already exists/i.test(m)) return "Ya existe una cuenta de acceso con ese correo.";
  if(/password should be at least|weak password/i.test(m)) return "La contraseña es muy débil: use al menos 8 caracteres con letras y números.";
  if(/rate limit|too many/i.test(m)) return "Demasiados intentos seguidos. Espere unos minutos y vuelva a intentarlo.";
  if(/signups not allowed|signup is disabled/i.test(m)) return "El registro de cuentas está desactivado en Supabase (Authentication → Providers → Email → Allow new users to sign up).";
  if(/same as the old|different from the old/i.test(m)) return "La nueva contraseña debe ser diferente de la anterior.";
  return m || "Ocurrió un error inesperado.";
}
function validarClave(p1, p2){
  if(!p1 || p1.length < 8) return "La contraseña debe tener al menos 8 caracteres.";
  if(!/[A-Za-z]/.test(p1) || !/[0-9]/.test(p1)) return "La contraseña debe combinar letras y números.";
  if(p1 !== p2) return "Las dos contraseñas no coinciden.";
  return "";
}
function generarClaveTemporal(){
  const sets = ["ABCDEFGHJKLMNPQRSTUVWXYZ","abcdefghijkmnpqrstuvwxyz","23456789","#$%*+?"];
  const plan = [0,0,1,1,1,2,2,2,3,1];
  const rnd = n => { try { return crypto.getRandomValues(new Uint32Array(1))[0] % n; } catch(e){ return Math.floor(Math.random() * n); } };
  return plan.map(i => sets[i][rnd(sets[i].length)]).join("");
}
// Crea la cuenta de acceso sin cerrar la sesión del Administrador (cliente aparte que no guarda sesión).
async function crearCuentaAcceso(email, clave, nombre){
  if(!AUTH_ON) return { ok: true, local: true };
  try{
    const sb2 = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "mtc-alta-usuarios" } });
    const opts = { data: { nombre } }; if(appUrl()) opts.emailRedirectTo = appUrl();
    const { data, error } = await sb2.auth.signUp({ email, password: clave, options: opts });
    if(error) return { ok: false, yaExiste: /already|registered|exists/i.test(error.message), msg: traducirErrorAuth(error) };
    if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return { ok: false, yaExiste: true, msg: "Ya existe una cuenta de acceso con ese correo." };
    const requiereConfirmar = !data.session;
    if(data.session){ try { await sb2.auth.signOut({ scope: "local" }); } catch(e){} }
    return { ok: true, requiereConfirmar };
  }catch(err){ return { ok: false, msg: traducirErrorAuth(err) }; }
}
async function enviarRestablecimiento(email){
  const opts = appUrl() ? { redirectTo: appUrl() } : undefined;
  const { error } = await sb.auth.resetPasswordForEmail(email, opts);
  return error ? traducirErrorAuth(error) : "";
}
async function initAuth(){
  sb.auth.onAuthStateChange((event, session) => {
    if(event === "PASSWORD_RECOVERY"){ authSession = session; S.authMode = "recuperar"; S.sesionLista = false; S.authCargando = false; render(); }
    else if(event === "TOKEN_REFRESHED" && session){ authSession = session; }
    else if(event === "SIGNED_OUT"){ authSession = null; S.sesionLista = false; }
  });
  try{
    const { data } = await sb.auth.getSession();
    authSession = data ? data.session : null;
  }catch(err){ authSession = null; }
  S.authCargando = false;
  if(URL_HASH_INICIAL.indexOf("type=recovery") !== -1 && authSession){ S.authMode = "recuperar"; render(); return; }
  if(authSession) await afterLogin(); else render();
}
async function afterLogin(){
  S.authErr = ""; S.authMsg = "Cargando la información del aplicativo…"; S.sesionLista = false; render();
  await dbLoadAll();
  if(dbStatus !== "conectado"){
    S.authMsg = ""; S.authErr = "Ingresó, pero no se pudo leer la base de datos. Verifique que ejecutó supabase_schema.sql actualizado y vuelva a intentarlo.";
    try { await sb.auth.signOut(); } catch(e){} authSession = null; render(); return;
  }
  const email = String((authSession.user && authSession.user.email) || "").toLowerCase();
  let u = users.find(x => String(x.correo || "").toLowerCase() === email);
  const hayAdminActivo = users.some(x => x.rol === "Administrador" && x.authActivo);
  if(S.activando){
    if(!u && !hayAdminActivo){
      u = { id: uid("u"), nombre: S.activando.nombre || email, correo: email, rol: "Administrador", area: "", authActivo: true, debeCambiarClave: false, accesoCreado: nowStamp(), creadoPor: "Activación inicial del Administrador" };
      users.push(u); dbSaveUser(u);
    } else if(!u || (u.rol !== "Administrador" && !u.authActivo)){
      S.activando = null; S.authMsg = ""; S.authMode = null;
      S.authErr = u ? "Este usuario no es Administrador: su acceso lo debe crear el Administrador desde la sección Usuarios." : "Ya existe un Administrador activo. Solicite su acceso al Administrador.";
      try { await sb.auth.signOut(); } catch(e){} authSession = null; render(); return;
    }
  }
  if(!u){
    S.authMsg = ""; S.authMode = null;
    S.authErr = "Su correo no está registrado como usuario del aplicativo. Solicite el acceso al Administrador.";
    try { await sb.auth.signOut(); } catch(e){} authSession = null; render(); return;
  }
  S.activando = null;
  S.currentUserId = u.id;
  let cambio = false;
  if(!u.authActivo){ u.authActivo = true; u.primerIngreso = nowStamp(); cambio = true; }
  if(S.claveRecienCambiada){ u.debeCambiarClave = false; S.claveRecienCambiada = false; cambio = true; }
  if(cambio) dbSaveUser(u);
  S.sesionLista = true; S.authMsg = ""; S.authErr = "";
  S.authMode = u.debeCambiarClave ? "cambiar" : null;
  S.view = "dashboard"; S.selectedId = null;
  render();
}
async function cerrarSesion(){
  try { await sb.auth.signOut(); } catch(e){}
  authSession = null; S.sesionLista = false; S.authMode = null; S.selectedId = null; S.view = "dashboard";
  S.shareAccess = null; S.authErr = ""; S.authMsg = "Sesión cerrada.";

}

      <div class="field"><label>Nueva contraseña</label><input type="password" name="p1" autocomplete="new-password" required minlength="8"></div>

      <div class="field"><label>Correo electrónico del Administrador</label><input type="email" name="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" name="p1" autocomplete="new-password" required minlength="8"></div>
      <div class="field"><label>Repita la contraseña</label><input type="password" name="p2" autocomplete="new-password" required minlength="8"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Activar cuenta</button>
      <div class="links"><a href="#" data-authmode="">Volver al ingreso</a></div>
    </form>`;
  } else {
    cuerpo = `<form id="authLoginForm">
      <div class="field"><label>Usuario (correo electrónico)</label><input type="email" name="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Ingresar</button>
      <div class="links">

function bindAuthEvents(){
  const root = document.getElementById("app");
  const ocupado = (form, txt) => { const b = form.querySelector("button[type=submit]"); if(b){ b.disabled = true; b.textContent = txt; } };
  root.querySelectorAll("[data-authmode]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); S.authMode = a.getAttribute("data-authmode") || null; S.authErr = ""; S.authMsg = ""; render(); }));
  root.querySelectorAll("[data-authsalir]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); cerrarSesion(); }));
  root.querySelectorAll("[data-authcancel]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); S.authMode = null; S.authErr = ""; render(); }));
  const login = document.getElementById("authLoginForm");
  if(login) login.addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(login);
    ocupado(login, "Ingresando…");
    const { data, error } = await sb.auth.signInWithPassword({ email: String(fd.get("email")).trim(), password: String(fd.get("password")) });
    if(error){ S.authErr = traducirErrorAuth(error); S.authMsg = ""; render(); return; }
    authSession = data.session; await afterLogin();
  });
  const olvido = document.getElementById("authOlvidoForm");
  if(olvido) olvido.addEventListener("submit", async e => {
    e.preventDefault();
    const email = String(new FormData(olvido).get("email")).trim();
    ocupado(olvido, "Enviando…");
    const err = await enviarRestablecimiento(email);
    S.authErr = err; S.authMsg = err ? "" : `Si ${email} tiene una cuenta, recibirá un correo con el enlace para crear una nueva contraseña.`;
    if(!err) S.authMode = null;
    render();
  });
  const activar = document.getElementById("authActivarForm");
  if(activar) activar.addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(activar);
    const err = validarClave(String(fd.get("p1")), String(fd.get("p2")));
    if(err){ S.authErr = err; render(); return; }
    ocupado(activar, "Activando…");
    const email = String(fd.get("email")).trim();
    const { data, error } = await sb.auth.signUp({ email, password: String(fd.get("p1")), options: { data: { nombre: String(fd.get("nombre")).trim() } } });
    if(error){ S.authErr = traducirErrorAuth(error); render(); return; }
    if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){ S.authErr = "Ya existe una cuenta con ese correo. Use Ingresar o «¿Olvidó su contraseña?»."; render(); return; }
    if(!data.session){ S.authMode = null; S.authErr = ""; S.authMsg = "Cuenta creada. Confirme su correo con el mensaje que envió Supabase y luego ingrese con su contraseña."; render(); return; }
    S.activando = { nombre: String(fd.get("nombre")).trim() };
    S.authMode = null; authSession = data.session; await afterLogin();
  });
  const cambiar = document.getElementById("authCambiarForm");
  if(cambiar) cambiar.addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(cambiar);
    const err = validarClave(String(fd.get("p1")), String(fd.get("p2")));
    if(err){ S.authErr = err; render(); return; }
    ocupado(cambiar, "Guardando…");
    const { error } = await sb.auth.updateUser({ password: String(fd.get("p1")) });
    if(error){ S.authErr = traducirErrorAuth(error); render(); return; }
    if(S.authMode === "recuperar" || !S.sesionLista){
      S.claveRecienCambiada = true; S.authMode = null;
      if(window.history && history.replaceState) history.replaceState(null, "", window.location.pathname + window.location.search);
      await afterLogin();
    } else {
      const u = currentUser(); u.debeCambiarClave = false; u.claveCambiadaEl = nowStamp(); dbSaveUser(u);
      S.authMode = null; S.authErr = ""; render();
      alert("Su contraseña se cambió correctamente.");
    }
  });
}

function solicitanteEstado(rec){
  if(rec.resultado === "Rechazada") return `<span class="badge" style="background:#fee2e2;color:#b91c1c;">Rechazada</span>`;
  if(isClosed(rec)) return `<span class="badge" style="background:#dcfce7;color:#15803d;">${icon("check")} Cerrada</span>`;
  if(rec.devuelta) return `<span class="badge" style="background:#ffedd5;color:#c2410c;">Devuelta para ajustes</span>`;
  if(rec.stage <= STAGE_EVAL) return `<span class="badge" style="background:#ede9fe;color:#6d28d9;"><span class="dot"></span>En evaluación y aprobación</span>`;
  return `<span class="badge" style="background:#fef3c7;color:#92400e;"><span class="dot"></span>Aprobada — en ejecución, pendiente de cierre</span>`;
}

    ${misBorradores().length ? `<div class="banner banner-amber">${icon("clip")} <span>Tiene <b>${misBorradores().length}</b> solicitud(es) en borrador o devueltas para ajustes. Termínelas en <a href="#" data-nav="new" style="font-weight:700;">Nuevo registro</a>.</span></div>` : ""}
    <div class="list">
      ${list.length===0 ? `<div class="empty">No hay registros que coincidan con los filtros.</div>` : list.map(r => `
        <div class="row" data-open="${r.id}">
          <div class="row-top">
            <div><div class="row-title">${esc(r.tipoEspecifico)}</div><div class="row-sub">${r.id} · Responsable: ${esc(r.reportadoPor)}</div></div>
            ${icon("chevronRight")}
          </div>
          <div class="row-badges">
            ${r.devuelta ? `<span class="badge" style="background:#ffedd5;color:#c2410c;">Devuelta para ajustes</span>` : stageBadge(r.stage)} ${isClosed(r) && r.resultado!=="Rechazada" ? `<span class="badge" style="background:#dcfce7;color:#15803d;">${icon("check")} Cerrada</span>` : ""} ${r.resultado==="Rechazada" ? `<span class="badge" style="background:#fee2e2;color:#b91c1c;">Rechazada</span>` : ""} ${areaBadge(r.area)} ${tipoGestionBadge(r.tipoGestion)} ${criticidadBadge(r.criticidad)}
            ${r.d8Started ? `<span class="badge" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;">${icon("link")} 8D</span>` : ""}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}
function stageBadge(stage){ const c = STAGE_COLORS[stage]; return `<span class="badge" style="background:${c.bg};color:${c.fg};"><span class="dot"></span>${esc(STAGES[stage])}</span>`; }
function areaBadge(area){ const c = areaColor(area); return `<span class="badge" style="background:${c.bg};color:${c.fg};">${esc(area)}</span>`; }
function tipoGestionBadge(t){ const c = TIPO_GESTION_COLORS[t]; return `<span class="badge" style="background:${c.bg};color:${c.fg};">${esc(t)}</span>`; }
function criticidadBadge(c){ const i = CRITICIDAD_INFO[c]; return `<span class="badge" style="background:${i.bg};color:${i.fg};">Criticidad ${esc(c)}</span>`; }

  const vencD = daysUntil(rec.vigenciaFin);

  const dest = destinatariosEtapa(rec);
  const palabra = rec.tipoGestion === "Derogación" ? "derogación" : "desviación";
  const dueno = esDueno(u, rec), esAprob = u.rol === "Aprobador autorizado";
  const enEval = !cerrado && !rec.borrador && rec.stage === STAGE_EVAL;
  const puedeAprobar = enEval && (esAprob || isAdmin());   // evalúa y aprueba
  const puedeCerrar = !cerrado && rec.stage === STAGE_CIERRE && dueno;

  const asignado = rec.stage === STAGE_CIERRE ? rec.reportadoPor : "";

    return `<span class="stage-chip ${active?'active':''} ${done?'done':''}" style="${active?`background:${c.bg};color:${c.fg};`:''}">${i+1}. ${esc(s)}${done?" ✓":""}</span>`;

              <div class="radio-line" style="margin-top:4px;">
                <label class="checkline" style="margin:0;"><input type="radio" name="alcEdit" value="Temporal" ${rec.alcanceDerogacion !== "Definitiva" ? "checked" : ""}> Temporal</label>
                <label class="checkline" style="margin:0;"><input type="radio" name="alcEdit" value="Definitiva" ${rec.alcanceDerogacion === "Definitiva" ? "checked" : ""}> Definitiva</label>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
                <div class="field" style="margin:0;" id="alcEditIni"><label>${rec.alcanceDerogacion === "Definitiva" ? "Efectiva desde" : "Desde"}</label><input type="date" id="alcFechaIni" value="${esc(rec.alcanceDerogacion === "Definitiva" ? (rec.fechaEfectiva || rec.vigenciaInicio) : rec.vigenciaInicio)}"></div>
                <div class="field" style="margin:0;${rec.alcanceDerogacion === "Definitiva" ? "display:none;" : ""}" id="alcEditFin"><label>Hasta</label><input type="date" id="alcFechaFin" value="${esc(rec.vigenciaFin)}"></div>
                <button type="button" class="btn btn-outline btn-sm" id="btnGuardarAlcance">${icon("check")} Guardar alcance</button>
              </div>
            </div>` : ""}
            <div class="full"><div class="k">${rec.tipoGestion === "Derogación" ? "Alcance y vigencia de la derogación" : "Vigencia"}</div><div class="v" style="${vencD!==null&&vencD<=3&&!cerrado?'color:#dc2626;font-weight:600;':''}">${esc(vigenciaTexto(rec))}${vencD!==null&&!cerrado?` (${vencD<=0?'vencida':vencD+' días restantes'})`:""}</div></div>
          </div>
        </div>

        <div class="card" style="margin-top:12px;">
          <h3>3. Descripción de la ${palabra}</h3>
          <div class="kv" style="margin:0;">
            <div class="full"><div class="k">Política, estándar, procedimiento o requisito incumplido</div><div class="v">${esc(rec.requisitoIncumplido||"—")}</div></div>
            <div class="full"><div class="k">Equipo, herramienta, método o procedimiento involucrado</div><div class="v">${esc(rec.equipoInvolucrado||"—")}</div></div>
            <div class="full"><div class="k">Descripción breve de la tarea o requerimiento</div><div class="v">${esc(rec.tareaDescripcion||"—")}</div></div>
            <div class="full"><div class="k">Motivo por el cual se requiere la ${palabra}</div><div class="v">${esc(rec.motivoDesviacion||"—")}</div></div>
            <div class="full"><div class="k">Consecuencias potenciales</div><div class="v">${esc(rec.consecuenciasPotenciales||"—")}</div></div>
          </div>
        </div>

        ${rec.relacionadoSST ? `
          <div class="card" style="background:#fffaf0;border-color:#fde68a;margin-top:12px;">
            <h3>Detalle de Seguridad y Salud en el Trabajo (SST)</h3>
            <div class="kv" style="margin:0;">
              <div class="full"><div class="k">Clase de peligro (GTC 45)</div><div class="v">${esc(rec.peligroSST||"—")}${rec.condicionSeguridad ? " · " + esc(rec.condicionSeguridad) : ""}</div></div>
              <div><div class="k">EPP adicional</div><div class="v">${esc(rec.eppAdicional||"—")}</div></div>
              <div><div class="k">Procedimientos alternativos</div><div class="v">${esc(rec.procedimientosAlternativos||"—")}</div></div>
              <div class="full"><div class="k">Compañero de apoyo</div><div class="v">${esc(rec.companeroApoyo||"—")}</div></div>
            </div>
          </div>` : ""}

        <div class="card" style="margin-top:12px;${enEval?'border-color:#c4b5fd;':''}">
          <h3>Etapa 2 · Evaluación y Aprobación — Aprobador autorizado</h3>
          ${!puedeAprobar && enEval ? `<p class="hint" style="margin-top:-4px;">La diligencia el Aprobador autorizado.</p>` : ""}
          <div class="field"><label>Concepto de evaluación</label>
            <textarea id="conceptoEvaluacion" rows="2" ${puedeAprobar?"":"disabled"} placeholder="Viabilidad, riesgos y condiciones bajo las que se acepta la ${palabra}">${esc(rec.conceptoEvaluacion)}</textarea></div>
          <div class="field"><label>Medidas de control durante la ${palabra}</label>
            <textarea id="controlesCompensatorios" rows="2" ${puedeAprobar?"":"disabled"}>${esc(rec.controlesCompensatorios)}</textarea></div>
          <div class="field"><label>Observaciones de la aprobación (opcional)</label>
            <textarea id="observacionesAprobacion" rows="2" ${puedeAprobar?"":"disabled"} placeholder="Condiciones o recomendaciones de la aprobación">${esc(rec.observacionesAprobacion)}</textarea></div>
          ${rec.conceptoCalidad || rec.conceptoSST ? `<p class="hint">Conceptos registrados en una versión anterior: ${esc([rec.conceptoCalidad ? "Calidad: " + rec.conceptoCalidad : "", rec.conceptoSST ? "SST: " + rec.conceptoSST : ""].filter(Boolean).join(" · "))}</p>` : ""}
          <p class="hint" style="margin:0;">Los campos se guardan automáticamente al salir de cada uno; puede volver después a terminar.</p>
        </div>

        ${rec.tipoGestion === "Derogación" ? `
        <div class="d8box" id="d8-section">
          <div class="d8box-head"><h3>${icon("link")} Reporte 8D (obligatorio en toda derogación)</h3><button type="button" class="btn btn-outline btn-sm" data-help8d="1">${icon("help")} ¿Cómo diligenciarlo?</button></div>
          ${!puede8D && enEval ? `<p class="hint" style="padding:0 15px 10px;">Lo diligencian el Responsable del proceso y el Aprobador autorizado durante la Evaluación y Aprobación.</p>` : ""}
          ${!is8DComplete(rec) ? `<div class="banner banner-amber" style="margin:0 15px 10px;">${icon("alert")} <span><b>8D incompleto</b> (requerido para aprobar la evaluación). Falta: ${d8Faltantes(rec.d8).map(esc).join("; ")}</span></div>` : `<div class="banner banner-green" style="margin:0 15px 10px;">${icon("check")} 8D completo.</div>`}
          ${d8EditorHTML(rec.d8, {mode:"edit", disabled: !puede8D})}
        </div>
        ` : `<div class="banner banner-slate" style="margin-top:16px;">${icon("link")} El reporte 8D no aplica: esta figura es una desviación. El 8D solo se activa en derogaciones.</div>`}

        <div class="card" style="margin-top:12px;${rec.stage===STAGE_CIERRE&&!cerrado?'border-color:#86efac;':''}">
          <h3>Etapa 3 · Cierre — Responsable del proceso que hizo la solicitud</h3>
          ${!cerrado && rec.stage < STAGE_CIERRE ? `<p class="hint" style="margin-top:-4px;">Se habilita cuando la solicitud está aprobada y la actividad ha finalizado.</p>` : ""}
          ${!cerrado && rec.stage === STAGE_CIERRE && !dueno ? `<p class="hint" style="margin-top:-4px;">La cierra ${esc(rec.reportadoPor)}, quien hizo la solicitud.</p>` : ""}
          <div class="field"><label>Observaciones de cierre</label><textarea id="obsCierre" rows="2" ${puedeCerrar?"":"disabled"} placeholder="Resultado de la actividad y estado final de la condición">${esc(rec.observacionesCierre)}</textarea></div>
          <div class="field" style="max-width:240px;"><label>¿Se cumplieron los controles?</label>
            <select id="cumplimientoControl" ${puedeCerrar?"":"disabled"}>
              <option value="">Sin definir</option>
              <option value="Sí" ${rec.cumplimientoControl==="Sí"?"selected":""}>Sí</option>
              <option value="No" ${rec.cumplimientoControl==="No"?"selected":""}>No</option>
            </select>
          </div>
        </div>

        <div class="card" style="margin-top:12px;">
          <h3>Evidencias adjuntas (${rec.adjuntos.length})</h3>
          ${attachmentListHTML(rec.adjuntos)}
          ${!cerrado ? addAttachmentsControlHTML() : ""}
        </div>

        <div class="card" style="margin-top:12px;">
          <h3>Bitácora de seguimiento</h3>
          ${rec.bitacora.length===0 ? `<p class="empty" style="padding:6px 0;">Sin movimientos registrados.</p>` : `
            <div class="bitacora">
              ${rec.bitacora.slice().reverse().map(b => `
                <div class="bitacora-item">
                  <div class="meta">${esc(b.fecha)} · ${esc(b.etapa)} · ${esc(b.rol)} (${esc(b.usuario)})</div>
                  <div class="txt">${esc(b.comentario)}</div>
                </div>
              `).join("")}
            </div>
          `}
        </div>

        ${renderFirmasSection(rec)}
      </div>
    </div>
  </div>
  `;
}

/* ============================================================
   RENDER: Firmas de aprobación (al final de cada registro)
   ============================================================ */
function renderFirmasSection(rec){
  const slots = firmaSlotsFor(rec);
  const cerrado = isClosed(rec);
  const accion = {aprob:"Evaluar, aprobar y firmar", cierre:"Cerrar solicitud y firmar", admin:"Firmar visto bueno"};
  const html = slots.map(sl => {
    const f = rec.firmas[sl.key];
    const puede = canSignSlot(rec, sl);
    const actual = sl.stage === rec.stage && !cerrado;
    let estado;
    if(f) estado = `${f.dataUrl ? `<img src="${f.dataUrl}" alt="Firma">` : ""}<div class="hint" style="margin-top:4px;">${icon("check")} ${esc(f.nombre)}${f.fecha ? " · " + esc(f.fecha) : ""}</div>`;
    else if(sl.key === "admin") estado = `<div class="hint">Opcional</div>`;
    else if(rec.resultado === "Rechazada") estado = `<div class="hint">No aplica (solicitud rechazada)</div>`;
    else if(rec.devuelta && sl.key === "sol") estado = `<div class="hint" style="color:#c2410c;font-weight:600;">Pendiente — se firma al reenviar la solicitud corregida</div>`;
    else if(actual) estado = `<div class="hint" style="color:#92400e;font-weight:600;">Pendiente — requerida para pasar a la siguiente etapa</div>`;
    else estado = `<div class="hint">Pendiente</div>`;
    if(!puede) return `<div class="sign-slot" style="${actual && !f ? "border-color:#f59e0b;" : ""}"><div class="role">${esc(sl.label)}</div>${estado}</div>`;
    const falta = requisitosFirma(rec, sl);
    return `<div class="sign-slot mine">
        <div class="role">${esc(sl.label)} — <span style="color:var(--blue);">su firma</span></div>
        ${f ? `${estado}
          ${sl.key === "admin" ? `<button type="button" class="btn btn-outline btn-sm" data-quitarfirma="${sl.key}" style="margin-top:8px;">${icon("undo")} Borrar mi firma</button>` : ""}` : `
          ${falta.length ? `<div class="banner banner-amber" style="margin-bottom:8px;">${icon("alert")} <span>Antes de firmar complete: ${falta.map(esc).join("; ")}.</span></div>` : ""}
          <p class="hint" style="margin:0 0 6px;">Al firmar usted <b>aprueba la etapa ${esc(STAGES[sl.stage] || "")}</b> del registro ${esc(rec.id)}${sl.key === "cierre" ? " y la solicitud queda cerrada" : sl.key !== "admin" ? " y pasa a la siguiente etapa" : ""}. Dibuje su firma con el mouse o el dedo.</p>
          <canvas id="firmaRolCanvas" width="420" height="120" style="border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;max-width:100%;display:block;"></canvas>
          <input type="hidden" id="firmaRolInput">
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <button type="button" class="btn btn-outline btn-sm" id="btnClearFirmaRol">${icon("x")} Limpiar</button>
            <button type="button" class="btn btn-primary btn-sm" id="btnFirmarRol" data-slot="${sl.key}">${icon("check")} ${esc(accion[sl.key] || "Firmar")}</button>
          </div>`}
      </div>`;
  });
  const idx = slots.findIndex(sl => canSignSlot(rec, sl) && !rec.firmas[sl.key]);
  if(idx > -1){ const [m] = html.splice(idx, 1); html.unshift(m); }
  const req = slots.filter(sl => sl.key !== "admin");
  const firmadas = req.filter(sl => rec.firmas[sl.key]).length;
  return `
    <div class="card" style="margin-top:16px;" id="firmas-section">
      <h3>Firmas de aprobación (${firmadas}/${req.length})</h3>
      <p class="hint" style="margin:-4px 0 12px;">Responsable del proceso (solicitud) → Aprobador autorizado (evaluación y aprobación) → Responsable del proceso que hizo la solicitud (cierre). Solo se firma la etapa en curso.</p>
      <div class="sign-grid">${html.join("")}</div>
    </div>`;
}

/* ============================================================
   PDF DE TRAZABILIDAD (se habilita cuando el registro está cerrado)
   ============================================================ */
function downloadTrazabilidadPDF(rec){
  if(!rec || !isClosed(rec)){ alert("El PDF de trazabilidad se habilita cuando el registro finaliza todas sus etapas (Cierre)."); return; }
  const lib = window.jspdf;
  if(!lib || !lib.jsPDF || !(lib.jsPDF.API && lib.jsPDF.API.autoTable)){
    alert("No se pudo cargar el generador de PDF (se requiere conexión a internet). Se abrirá la vista de impresión: elija \"Guardar como PDF\".");
    printTrazabilidad(rec); return;
  }
  const doc = new lib.jsPDF({ unit: "pt", format: "letter" });
  const W = doc.internal.pageSize.getWidth(), M = 40;
  const NAVY = [20,46,71], GRAY = [100,116,139];
  const u = currentUser();
  const txt = v => (v === undefined || v === null || String(v).trim() === "") ? "—" : String(v);
  let y = 0;

  // Encabezado
  doc.setFillColor(...NAVY); doc.rect(0, 0, W, 80, "F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text("Reporte de trazabilidad — " + rec.id, M, 32);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.text("MATEC · Gestión de Desviaciones y Derogaciones", M, 50);
  doc.setFontSize(8.5);
  doc.text("Generado: " + nowStamp() + " · por " + u.nombre + " (" + u.rol + ")", M, 66);
  doc.setTextColor(30,41,59);
  y = 100;

  const section = (title) => {
    if(y > doc.internal.pageSize.getHeight() - 140){ doc.addPage(); y = 50; }
    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...NAVY);
    doc.text(title, M, y); doc.setDrawColor(226,232,240); doc.line(M, y + 4, W - M, y + 4);
    doc.setTextColor(30,41,59); y += 10;
  };
  const kvTable = (rows) => {
    doc.autoTable({ startY: y, margin: { left: M, right: M }, theme: "grid", body: rows.map(r => [r[0], txt(r[1])]),
      styles: { fontSize: 8.8, cellPadding: 4, valign: "top", lineColor: [226,232,240] },
      columnStyles: { 0: { cellWidth: 150, fontStyle: "bold", fillColor: [241,245,249], textColor: [71,85,105] } } });
    y = doc.lastAutoTable.finalY + 16;
  };
  const table = (head, body, extra) => {
    doc.autoTable(Object.assign({ startY: y, margin: { left: M, right: M }, theme: "striped", head: [head], body: body.length ? body : [head.map((_,i) => i===0 ? "Sin información" : "")],
      styles: { fontSize: 8.5, cellPadding: 4, valign: "top" }, headStyles: { fillColor: NAVY, textColor: 255, fontStyle: "bold" } }, extra || {}));
    y = doc.lastAutoTable.finalY + 16;
  };

  section("1. Información del solicitante");
  kvTable([
    ["Consecutivo", rec.id], ["Fecha y hora", (rec.fechaHora || "").replace("T"," ")],
    ["Nombre y apellido (Responsable del proceso)", rec.reportadoPor], ["Cargo", rec.cargo], ["Área (según organigrama)", rec.areaSolicitante],
    ["Proceso", rec.procesoSolicitante],
  ]);

  section("2. Clasificación y proyecto");
  kvTable([
    ["Solicitud dirigida al área de", rec.area],
    ["Solicitud relacionada con temas de", rec.tema || rec.area],
    ["Tipo específico de Desviación o Derogación", rec.tipoEspecifico],
    ...(rec.condicionSeguridad ? [[gtcLabel(rec.peligroSST || rec.tipoEspecifico), rec.condicionSeguridad]] : []),
    ["OT", rec.ot], ["Nombre del proyecto", rec.proyecto], ["Línea de negocio", rec.lineaNegocio],
    ["Figura", rec.tipoGestion], ["Nivel de criticidad", rec.criticidad], ["Condición recurrente", rec.recurrente ? "Sí" : "No"],
    [rec.tipoGestion === "Derogación" ? "Alcance y vigencia de la derogación" : "Vigencia", vigenciaTexto(rec)],
    ["Resultado", rec.resultado === "Rechazada" ? "Rechazada" : "Cerrada"], ["Fecha de cierre", rec.fechaCierre],
  ]);

  section("3. Descripción de la " + rec.tipoGestion.toLowerCase());
  const desc = [
    ["Requisito incumplido", rec.requisitoIncumplido], ["Equipo / método involucrado", rec.equipoInvolucrado],
    ["Tarea o requerimiento", rec.tareaDescripcion], ["Motivo", rec.motivoDesviacion],
    ["Consecuencias potenciales", rec.consecuenciasPotenciales],
  ];
  if(rec.relacionadoSST) desc.push(["EPP adicional", rec.eppAdicional], ["Procedimientos alternativos", rec.procedimientosAlternativos], ["Compañero de apoyo", rec.companeroApoyo]);
  kvTable(desc);

  section("4. Evaluación y aprobación (Aprobador autorizado)");
  const ev = [["Concepto de evaluación", rec.conceptoEvaluacion], ["Medidas de control", rec.controlesCompensatorios], ["Observaciones de la aprobación", rec.observacionesAprobacion]];
  if(rec.conceptoCalidad) ev.push(["Concepto de Calidad (versión anterior)", rec.conceptoCalidad]);
  if(rec.conceptoSST) ev.push(["Concepto de SST (versión anterior)", rec.conceptoSST]);
  kvTable(ev);

  let n = 5;
  if(rec.tipoGestion === "Derogación"){
    section(n++ + ". Reporte 8D");
    const d8 = rec.d8 || emptyD8();
    kvTable([["D1 · Equipo", d8.d1]]);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.text("D2 · Descripción del problema — 5W2H", M, y); y += 6;
    table(["Pregunta", "Respuesta"], W2H_FIELDS.map(w => [w.label + " — " + w.pregunta, txt(d8.w2h && d8.w2h[w.key])]), { columnStyles: { 0: { cellWidth: 170, fontStyle: "bold" } } });
    if(d8.d2) kvTable([["Síntesis del problema", d8.d2]]);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.text("D3 · Acciones de contención", M, y); y += 6;
    table(["Acción de contención", "Punto de control", "Fecha", "Responsable"], (d8.contencion || []).filter(r => r.accion || r.puntoControl).map(r => [txt(r.accion), txt(r.puntoControl), txt(r.fecha), txt(r.responsable)]), { columnStyles: { 2: { cellWidth: 62 } } });
    if(d8.d3) kvTable([["Observaciones D3", d8.d3]]);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.text("D4 · Causa raíz — 5 Porqués", M, y); y += 6;
    table(["#", "¿Por qué?"], (d8.whys || []).map((w, i) => [String(i+1), txt(w)]), { columnStyles: { 0: { cellWidth: 30 } } });
    kvTable([
      ["D4 · Causa raíz identificada", d8.d4],
    ]);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.text("D5 · Acciones correctivas permanentes", M, y); y += 6;
    table(["Causa", "Acción correctiva", "Fecha", "Responsable"], (d8.correctivas || []).filter(r => r.causa || r.accion).map(r => [txt(r.causa), txt(r.accion), txt(r.fecha), txt(r.responsable)]), { columnStyles: { 2: { cellWidth: 62 } } });
    kvTable([
      ...(d8.d5 ? [["Observaciones D5", d8.d5]] : []),
      ["D6 · Implementación y validación", d8.d6], ["D7 · Acciones preventivas", d8.d7], ["D8 · Cierre y reconocimiento", d8.d8],
    ]);
  }

  section(n++ + ". Cierre (Responsable del proceso)");
  kvTable([["Observaciones de cierre", rec.observacionesCierre], ["Cumplimiento de controles", rec.cumplimientoControl]]);

  section(n++ + ". Evidencias adjuntas (" + rec.adjuntos.length + ")");
  table(["Archivo", "Tamaño", "Cargado por", "Fecha"], rec.adjuntos.map(a => [a.nombre, fmtSize(a.tamano) || "—", txt(a.usuario), txt(a.fecha)]));

  section(n++ + ". Firmas de aprobación por etapa");
  const slots = firmaSlotsFor(rec);
  table(["Etapa / firma", "Rol", "Firmado por", "Fecha", "Firma"],
    slots.map(sl => { const f = rec.firmas[sl.key]; return [sl.label, f && f.rol ? f.rol : sl.rol, f ? f.nombre : "Sin firma", f ? txt(f.fecha) : "—", ""]; }),
    { columnStyles: { 4: { cellWidth: 110, minCellHeight: 34 } },
      didDrawCell: (data) => {
        if(data.section === "body" && data.column.index === 4){
          const f = rec.firmas[slots[data.row.index] && slots[data.row.index].key];
          if(f && f.dataUrl && f.dataUrl.indexOf("data:image") === 0){
            try { doc.addImage(f.dataUrl, "PNG", data.cell.x + 3, data.cell.y + 2, 100, data.cell.height - 4); } catch(e){ /* imagen no válida */ }
          }
        }
      } });

  section(n++ + ". Bitácora de seguimiento");
  table(["Fecha", "Etapa", "Rol", "Usuario", "Comentario"], rec.bitacora.map(b => [txt(b.fecha), txt(b.etapa), txt(b.rol), txt(b.usuario), txt(b.comentario)]),
    { columnStyles: { 0: { cellWidth: 62 }, 1: { cellWidth: 88 }, 2: { cellWidth: 82 }, 3: { cellWidth: 90 } } });

  // Pie de página
  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...GRAY);
    doc.text(rec.id + " · Trazabilidad completa · MATEC", M, doc.internal.pageSize.getHeight() - 20);
    doc.text("Página " + i + " de " + pages, W - M, doc.internal.pageSize.getHeight() - 20, { align: "right" });
  }
  doc.save("Trazabilidad_" + rec.id + ".pdf");
  addBitacora(rec, "Descargó el PDF de trazabilidad.");
  dbSaveRecord(rec);
}
// Alternativa sin conexión: vista imprimible (el navegador permite "Guardar como PDF").
function printTrazabilidad(rec){
  const w = window.open("", "_blank");
  if(!w){ alert("Permita las ventanas emergentes para generar el PDF."); return; }
  const row = (k, v) => `<tr><th>${esc(k)}</th><td>${esc(v || "—")}</td></tr>`;
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Trazabilidad ${esc(rec.id)}</title>

function openHelp8DModal(){

      '¿No terminó? Pulse <b>Guardar borrador</b>. Sus borradores aparecen al inicio de "Nuevo registro" con el botón <b>Continuar</b>.',

      'Para aprobar: firme en "2 · Evaluación y Aprobación" con <b>Evaluar, aprobar y firmar</b>. La solicitud pasa a Cierre y se avisa al Responsable del proceso.',

      'En <b>Tipos de desviación</b>: mantenga los tipos específicos de cada área.',
      'En <b>Registros</b>: descargue el histórico en Excel. Si hace falta corregir una solicitud aprobada, use <b>Etapa anterior</b> (anula la firma de aprobación).',
