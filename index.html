    <h2>Ejemplos de flujo por tipo de solicitud</h2>
    <p>El flujo es el mismo para todas las áreas; cambia el área y quién es el Responsable del proceso. Los registros de ejemplo del aplicativo (MTC-001 a MTC-005) siguen estos casos.</p>
    ${flujosEjemploHTML()}

    ${instructivo8DHTML()}

    <h2>Herramientas del 8D (resumen)</h2>
    <ul>
      <li><b>D2 · 5W2H</b>: What, Where, When, Who, Why, How, How much. Las 7 son obligatorias.</li>
      <li><b>D3 · Acciones de contención</b>: tabla con acción, punto de control, fecha de realización y responsable.</li>
      <li><b>D4 · 5 Porqués</b>: mínimo 3 porqués y la causa raíz identificada.</li>
      <li><b>D5 · Acciones correctivas</b>: tabla con causa, acción correctiva, fecha de realización y responsable.</li>
    </ul>

    <h2>Persistencia de datos</h2>
    <ul>
      <li><b>Modo conectado</b> (indicador verde "Base de datos conectada"): todo se guarda en Supabase, incluidos los borradores, y lo ven los usuarios autorizados.</li>
      <li><b>Modo local</b> (indicador gris): los datos son de ejemplo y se reinician al recargar la página.</li>
    </ul>
    <p class="hint">Los archivos adjuntos se guardan dentro del registro; se recomienda no superar ${MAX_FILE_MB} MB por archivo.</p>
  </div>
  `;
}

/* ============================================================
   EVENTOS
   ============================================================ */
function bindGlobalEvents(){
  const app = document.getElementById("app");
  const userSwitch = document.getElementById("userSwitch");
  if(userSwitch) userSwitch.addEventListener("change", e => {
    S.currentUserId = e.target.value; S.selectedId = null; S.editUserId = null; S.editDraftId = null; S.draftSavedMsg = "";
    draftAdjuntos = []; draftActs = { d3: [emptyActRow("d3")], d5: [emptyActRow("d5")] };
    if(S.view === "created" || (S.view === "new" && !puedeCrear())) S.view = "dashboard";
    if(!isAdmin() && (S.view === "users" || S.view === "types")) S.view = "dashboard";
    render();
  });

  const btnSalir = document.getElementById("btnSalir");
  if(btnSalir) btnSalir.addEventListener("click", cerrarSesion);
  const btnCambiarClave = document.getElementById("btnCambiarClave");
  if(btnCambiarClave) btnCambiarClave.addEventListener("click", () => { S.authMode = "cambiar"; S.authErr = ""; S.authMsg = ""; render(); });
  app.querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", e => { e.preventDefault(); S.view = btn.getAttribute("data-nav"); S.selectedId = null; S.editUserId = null; S.draftSavedMsg = ""; render(); }));
  app.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", () => { S.selectedId = el.getAttribute("data-open"); render(); }));

  const searchInput = document.getElementById("searchInput");
  if(searchInput) searchInput.addEventListener("input", e => { S.search = e.target.value; renderListOnly(); });
  ["fArea","fTipo","fEtapa"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener("change", e => { if(id==="fArea")S.fArea=e.target.value; if(id==="fTipo")S.fTipo=e.target.value; if(id==="fEtapa")S.fEtapa=e.target.value; render(); });
  });

  // "Nuevo registro": área a la que va dirigida → tipos específicos de esa área y, si es SST, clasificación GTC 45
  const areaSelect = document.getElementById("areaSelect");
  const temaSelect = document.getElementById("temaSelect");
  const temaOtroInput = document.getElementById("temaOtroInput");
  const tipoEspecificoSelect = document.getElementById("tipoEspecificoSelect");
  const tipoOtroInput = document.getElementById("tipoOtroInput");
  const tipoDescHint = document.getElementById("tipoDescHint");
  const sstFieldset = document.getElementById("sstFieldset");
  // Los tipos específicos dependen del tema; si el tema es "Otro", el usuario escribe también el tipo.
  function temaActual(){ return temaSelect && temaSelect.value !== OTRO ? temaSelect.value : ""; }
  function refreshTipoOptions(){
    const tema = temaActual();
    const lista = tema ? typesFor(tema) : [];
    tipoEspecificoSelect.innerHTML = lista.map(t=>`<option value="${esc(t.nombre)}">${esc(t.nombre)}</option>`).join("") + `<option value="${OTRO}">${OTRO_LABEL}</option>`;
    if(!lista.length) tipoEspecificoSelect.value = OTRO;
    updateTipoHint();
  }
  function syncOtros(){
    const temaOtro = temaSelect.value === OTRO, tipoOtro = tipoEspecificoSelect.value === OTRO;
    temaOtroInput.style.display = temaOtro ? "block" : "none"; temaOtroInput.required = temaOtro;
    tipoOtroInput.style.display = tipoOtro ? "block" : "none"; tipoOtroInput.required = tipoOtro;
  }
  function updateTipoHint(){
    const tema = temaActual();
    const t = tema ? typesFor(tema).find(x=>x.nombre===tipoEspecificoSelect.value) : null;
    tipoDescHint.textContent = tipoEspecificoSelect.value === OTRO ? "Escriba el tipo específico si no lo encuentra en la lista." : ((t && t.desc) ? t.desc : "");
    syncOtros();
    syncSST();
  }
  function syncSST(){
    const esSST = areaSelect.value === AREA_SST || temaActual() === AREA_SST;
    sstFieldset.style.display = esSST ? "block" : "none";
    const sel = document.getElementById("gtcSelect"), peligro = tipoEspecificoSelect.value === OTRO ? "" : tipoEspecificoSelect.value;
    const opts = esSST ? gtcOptions(peligro) : [];
    if(sel.dataset.peligro !== peligro){
      sel.innerHTML = `<option value="">Seleccione…</option>` + gtcOptions(peligro).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
      sel.dataset.peligro = peligro;
    }
    document.getElementById("gtcLabel").textContent = gtcLabel(peligro);
    document.getElementById("gtcWrap").style.display = opts.length ? "block" : "none";
    sel.required = opts.length > 0;
  }
  if(areaSelect){
    // Al cambiar el área, el tema se iguala al área (se puede cambiar después).
    areaSelect.addEventListener("change", () => { if(temaSelect.value !== OTRO) temaSelect.value = areaSelect.value; refreshTipoOptions(); });
    temaSelect.addEventListener("change", refreshTipoOptions);
    tipoEspecificoSelect.addEventListener("change", updateTipoHint);
    temaSelect.value = areaSelect.value;
    refreshTipoOptions();
  }

  const tipoGestionSelect = document.getElementById("tipoGestionSelect");
  const derogacionWarning = document.getElementById("derogacionWarning");
  const tipoGestionHint = document.getElementById("tipoGestionHint");
  const criticidadSelect = document.getElementById("criticidadSelect");
  const lblFieldsetDesc = document.getElementById("lblFieldsetDesc");
  const lblMotivo = document.getElementById("lblMotivo");
  const lblMedidasControl = document.getElementById("lblMedidasControl");
  const d8Fieldset = document.getElementById("d8Fieldset");
  if(tipoGestionSelect){
    function syncTipoGestionUI(){
      const isDerogacion = tipoGestionSelect.value === "Derogación";
      const palabra = isDerogacion ? "derogación" : "desviación";
      derogacionWarning.style.display = isDerogacion ? "flex" : "none";
      tipoGestionHint.textContent = TIPO_GESTION_DESC[tipoGestionSelect.value];
      if(lblFieldsetDesc) lblFieldsetDesc.textContent = `3. Descripción de la ${palabra}`;
      if(lblMotivo) lblMotivo.textContent = `Motivo por el cual se requiere la ${palabra}`;
      if(lblMedidasControl) lblMedidasControl.textContent = `Medidas de control implementadas durante la ${palabra}`;
      if(d8Fieldset){
        d8Fieldset.style.display = isDerogacion ? "block" : "none";
      }
      const opts = isDerogacion ? CRITICIDADES : CRITICIDADES_DESVIACION;
      const prev = criticidadSelect.value;
      criticidadSelect.innerHTML = opts.map(c=>`<option>${esc(c)}</option>`).join("");
      if(opts.includes(prev)) criticidadSelect.value = prev;
      syncAlcance();
    }
    // Derogación temporal: rango de fechas obligatorio. Definitiva: fecha efectiva obligatoria.
    function syncAlcance(){
      const form = document.getElementById("newRecordForm"); if(!form) return;
      const isDerogacion = tipoGestionSelect.value === "Derogación";
      const sel = form.querySelector('[name="alcanceDerogacion"]:checked');
      const definitiva = isDerogacion && sel && sel.value === "Definitiva";
      document.getElementById("alcanceDerogWrap").style.display = isDerogacion ? "block" : "none";
      document.getElementById("vigenciaRango").style.display = definitiva ? "none" : "";
      document.getElementById("fechaEfectivaWrap").style.display = definitiva ? "block" : "none";
      form.querySelector('[name="fechaEfectiva"]').required = definitiva;
      const temporal = isDerogacion && !definitiva;
      form.querySelector('[name="vigenciaInicio"]').required = temporal;
      form.querySelector('[name="vigenciaFin"]').required = temporal;
      document.getElementById("lblVigIni").textContent = temporal ? "Vigencia temporal — desde" : "Vigencia — inicio";
      document.getElementById("lblVigFin").textContent = temporal ? "Vigencia temporal — hasta" : "Vigencia — fin";
    }
    tipoGestionSelect.addEventListener("change", syncTipoGestionUI);
    document.querySelectorAll('[name="alcanceDerogacion"]').forEach(r => r.addEventListener("change", syncAlcance));
  }

  setupSignaturePad("firmaCanvas", "firmaSolicitanteInput", "btnClearFirma");

  // D3 / D5 en "Nuevo registro": filas de acciones en borrador
  function refreshDraftActs(kind){
    const box = document.getElementById("actbox-form-" + kind);
    if(box){ box.innerHTML = actTableHTML(kind, draftActs[kind], {form:true}); bindDraftActs(box); }
  }
  function bindDraftActs(root){
    root.querySelectorAll("[data-draftact]").forEach(inp => inp.addEventListener("input", () => {
      const [kind, i, key] = inp.getAttribute("data-draftact").split("|");
      draftActs[kind][+i][key] = inp.value;
    }));
    root.querySelectorAll("[data-draftaddrow]").forEach(b => b.addEventListener("click", () => {
      const kind = b.getAttribute("data-draftaddrow"); draftActs[kind].push(emptyActRow(kind)); refreshDraftActs(kind);
    }));
    root.querySelectorAll("[data-draftdelrow]").forEach(b => b.addEventListener("click", () => {
      const [kind, i] = b.getAttribute("data-draftdelrow").split("|"); draftActs[kind].splice(+i, 1); refreshDraftActs(kind);
    }));
  }
  if(document.getElementById("newRecordForm")) bindDraftActs(document.getElementById("newRecordForm"));

  // Acceso directo al instructivo del 8D
  // Se abre en una ventana emergente para no perder lo que se está diligenciando.
  app.querySelectorAll("[data-help8d]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); openHelp8DModal(); }));

  // Cargue de varios archivos en "Nuevo registro" (se acumulan hasta crear el registro)
  const newAdjInput = document.getElementById("newAdjuntosInput");
  function bindDraftRemove(){
    app.querySelectorAll("[data-rmdraft]").forEach(b => b.addEventListener("click", () => {
      const id = b.getAttribute("data-rmdraft");
      draftAdjuntos = draftAdjuntos.filter(a => a.id !== id);
      refreshDraftList();
    }));
  }
  function refreshDraftList(){
    const box = document.getElementById("draftAdjuntosList");
    if(box){ box.innerHTML = attachmentListHTML(draftAdjuntos, {removable:"rmdraft", emptyText:"Aún no ha agregado archivos."}); bindDraftRemove(); }
  }
  if(newAdjInput){
    bindDraftRemove();
    newAdjInput.addEventListener("change", () => {
      const files = Array.from(newAdjInput.files || []).slice(0, MAX_FILES_BATCH);
      readFilesAsAttachments(files).then(({adjuntos, rechazados}) => {
        draftAdjuntos = draftAdjuntos.concat(adjuntos);
        newAdjInput.value = "";
        refreshDraftList();
        if(rechazados.length) alert(`No se adjuntaron (superan ${MAX_FILE_MB} MB): ` + rechazados.join(", "));
      });
    });
  }

  const newRecordForm = document.getElementById("newRecordForm");
  if(newRecordForm){
    newRecordForm.addEventListener("submit", handleCreateRecord);
    document.getElementById("btnGuardarBorrador").addEventListener("click", () => guardarBorrador(newRecordForm));
    if(S.editDraftId){ S.populateDraft = false; const d = records.find(r => r.id === S.editDraftId); if(d) populateFormFromDraft(newRecordForm, d); else S.editDraftId = null; }
  }
  app.querySelectorAll("[data-contdraft]").forEach(b => b.addEventListener("click", () => abrirBorrador(b.getAttribute("data-contdraft"))));
  app.querySelectorAll("[data-deldraft]").forEach(b => b.addEventListener("click", () => {
    const id = b.getAttribute("data-deldraft");
    if(!confirm("¿Eliminar este borrador? No se puede recuperar.")) return;
    records = records.filter(r => r.id !== id); dbDeleteRecord(id);
    if(S.editDraftId === id){ S.editDraftId = null; draftAdjuntos = []; draftActs = { d3: [emptyActRow("d3")], d5: [emptyActRow("d5")] }; }
    S.draftSavedMsg = ""; render();
  }));
  const btnNuevoLimpio = document.getElementById("btnNuevoLimpio");
  if(btnNuevoLimpio) btnNuevoLimpio.addEventListener("click", e => { e.preventDefault(); S.editDraftId = null; S.draftSavedMsg = ""; draftAdjuntos = []; draftActs = { d3: [emptyActRow("d3")], d5: [emptyActRow("d5")] }; render(); });
  const btnExcel = document.getElementById("btnExcel");
  if(btnExcel) btnExcel.addEventListener("click", descargarHistoricoExcel);

  const overlay = document.getElementById("panelOverlay");
  if(overlay){
    overlay.addEventListener("click", e => { if(e.target.id === "panelOverlay"){ S.selectedId = null; render(); } });
    document.getElementById("panelBox").addEventListener("click", e => e.stopPropagation());
    document.getElementById("closePanel").addEventListener("click", () => { S.selectedId = null; render(); });

    const btnEliminarRegistro = document.getElementById("btnEliminarRegistro");
    if(btnEliminarRegistro) btnEliminarRegistro.addEventListener("click", async () => {
      const id = S.selectedId;
      const resp = prompt(`Eliminar el registro ${id}.\n\nQuedará la huella de quién lo eliminó, cuándo y por qué (menú "Registros eliminados").\n\nEscriba el motivo de la eliminación:`);
      if(resp === null) return;
      const motivo = resp.trim();
      if(!motivo){ alert("La eliminación requiere un motivo. No se eliminó el registro."); return; }
      if(!confirm(`¿Confirma eliminar el registro ${id}?`)) return;
      const ok = await eliminarRegistroAdmin(id, motivo);
      if(ok){ S.selectedId = null; render(); alert(`Registro ${id} eliminado. La huella quedó en "Registros eliminados".`); }
    });
    const btnRetreat = document.getElementById("btnRetreat");
    if(btnRetreat) btnRetreat.addEventListener("click", () => stageMove(S.selectedId, -1));

    // Ajuste del alcance de una derogación (temporal / definitiva) desde el detalle
    document.querySelectorAll('[name="alcEdit"]').forEach(r => r.addEventListener("change", () => {
      const def = document.querySelector('[name="alcEdit"]:checked').value === "Definitiva";
      document.getElementById("alcEditFin").style.display = def ? "none" : "";
      document.querySelector("#alcEditIni label").textContent = def ? "Efectiva desde" : "Desde";
    }));
    const btnGuardarAlcance = document.getElementById("btnGuardarAlcance");
    if(btnGuardarAlcance) btnGuardarAlcance.addEventListener("click", () => {
      const rec = records.find(r=>r.id===S.selectedId);
      const alc = document.querySelector('[name="alcEdit"]:checked').value;
      const ini = document.getElementById("alcFechaIni").value, fin = document.getElementById("alcFechaFin").value;
      const d = { tipoGestion: "Derogación", alcanceDerogacion: alc, fechaEfectiva: alc === "Definitiva" ? ini : "", vigenciaInicio: ini, vigenciaFin: alc === "Definitiva" ? "" : fin };
      const err = validarVigencia(d); if(err){ alert(err); return; }
      const antes = vigenciaTexto(rec);
      Object.assign(rec, d);
      rec.bitacora.push({ etapa: STAGES[rec.stage], rol: currentUser().rol, usuario: currentUser().nombre, fecha: todayISO(0), comentario: `Alcance de la derogación ajustado: ${antes} → ${vigenciaTexto(rec)}.` });
      dbSaveRecord(rec); render();
    });
    const btnConvert = document.getElementById("btnConvert");
    if(btnConvert) btnConvert.addEventListener("click", () => {
      const rec = records.find(r=>r.id===S.selectedId);
      rec.tipoGestion = "Derogación"; rec.d8Started = true; rec.alcanceDerogacion = "Temporal";
      rec.bitacora.push({etapa: STAGES[rec.stage], rol: currentUser().rol, usuario: currentUser().nombre, fecha: todayISO(0), comentario: "Convertida de desviación a derogación por recurrencia. Se activa el análisis 8D."});
      dbSaveRecord(rec); render();
      setTimeout(() => { const el = document.getElementById("d8-section"); if(el) el.scrollIntoView({behavior:"smooth"}); }, 50);
    });

    // 8D: campos generales, 5W2H (D2) y 5 Porqués (D4). Se guarda al salir de cada campo.
    function onD8Change(apply){ return e => {
      const rec = records.find(r=>r.id===S.selectedId);
      apply(rec, e.target);
      dbSaveRecord(rec);
      const y = document.getElementById("panelBox") ? document.getElementById("panelBox").scrollTop : 0;
      render(); // refresca los avisos que dependen de si el 8D está completo
      const pb = document.getElementById("panelBox"); if(pb) pb.scrollTop = y;
    }; }
    app.querySelectorAll("[data-d8]").forEach(ta => ta.addEventListener("change", onD8Change((rec, el) => { rec.d8[el.getAttribute("data-d8")] = el.value; })));
    app.querySelectorAll("[data-w2h]").forEach(ta => ta.addEventListener("change", onD8Change((rec, el) => { rec.d8.w2h[el.getAttribute("data-w2h")] = el.value; })));
    app.querySelectorAll("[data-why]").forEach(ta => ta.addEventListener("change", onD8Change((rec, el) => { rec.d8.whys[+el.getAttribute("data-why")] = el.value; })));
    app.querySelectorAll("[data-act]").forEach(inp => inp.addEventListener("change", onD8Change((rec, el) => {
      const [kind, i, key] = el.getAttribute("data-act").split("|");
      rec.d8[ACT_TABLES[kind].prop][+i][key] = el.value;
    })));
    app.querySelectorAll("[data-addrow]").forEach(b => b.addEventListener("click", onD8Change((rec, el) => {
      const kind = b.getAttribute("data-addrow"); rec.d8[ACT_TABLES[kind].prop].push(emptyActRow(kind));
    })));
    app.querySelectorAll("[data-delrow]").forEach(b => b.addEventListener("click", onD8Change((rec, el) => {
      const [kind, i] = b.getAttribute("data-delrow").split("|"); rec.d8[ACT_TABLES[kind].prop].splice(+i, 1);
    })));

    const btnPdf = document.getElementById("btnPdf");
    if(btnPdf) btnPdf.addEventListener("click", () => downloadTrazabilidadPDF(records.find(r=>r.id===S.selectedId)));
    // Campos de Evaluación, Aprobación y Cierre: se guardan al salir de cada campo
    [["conceptoEvaluacion","conceptoEvaluacion"],["controlesCompensatorios","controlesCompensatorios"],["observacionesAprobacion","observacionesAprobacion"],["obsCierre","observacionesCierre"]].forEach(([id, prop]) => {
      const el = document.getElementById(id);
      if(el) el.addEventListener("change", e => {
        const rec = records.find(r=>r.id===S.selectedId);
        rec[prop] = e.target.value;
        dbSaveRecord(rec);
        const pb = document.getElementById("panelBox"); const y = pb ? pb.scrollTop : 0;
        render(); const pb2 = document.getElementById("panelBox"); if(pb2) pb2.scrollTop = y; // refresca los requisitos de la firma
      });
    });
    // Adjuntar varios archivos a un registro existente
    const btnAddAdj = document.getElementById("btnAddAdjuntos");
    if(btnAddAdj) btnAddAdj.addEventListener("click", () => {
      const inp = document.getElementById("addAdjuntosInput");
      const files = Array.from((inp && inp.files) || []).slice(0, MAX_FILES_BATCH);
      if(!files.length){ alert("Seleccione uno o varios archivos primero."); return; }
      const recId = S.selectedId;
      readFilesAsAttachments(files).then(({adjuntos, rechazados}) => {
        const rec = records.find(r=>r.id===recId);
        if(adjuntos.length){
          rec.adjuntos = rec.adjuntos.concat(adjuntos);
          addBitacora(rec, `Adjuntó ${adjuntos.length} archivo(s): ${adjuntos.map(a=>a.nombre).join(", ")}.`);
          dbSaveRecord(rec);
        }
        render();
        if(rechazados.length) alert(`No se adjuntaron (superan ${MAX_FILE_MB} MB): ` + rechazados.join(", "));
      });
    });

    // Firma de aprobación del rol en sesión
    setupSignaturePad("firmaRolCanvas", "firmaRolInput", "btnClearFirmaRol");
    const btnFirmarRol = document.getElementById("btnFirmarRol");
    if(btnFirmarRol) btnFirmarRol.addEventListener("click", () => {
      const rec = records.find(r=>r.id===S.selectedId);
      const slot = FIRMA_SLOTS.find(sl => sl.key === btnFirmarRol.getAttribute("data-slot"));
      if(!slot || !canSignSlot(rec, slot)) return;
      const falta = requisitosFirma(rec, slot);
      if(falta.length){ alert("Antes de firmar complete: " + falta.join("; ")); return; }
      const dataUrl = (document.getElementById("firmaRolInput") || {}).value || "";
      if(!dataUrl){ alert("Dibuje su firma en el recuadro antes de firmar."); return; }
      const u = currentUser();
      const comentarioBox = document.getElementById("stageComment");
      const comentario = comentarioBox && comentarioBox.value.trim() ? " " + comentarioBox.value.trim() : "";
      rec.firmas[slot.key] = { nombre: u.nombre, usuarioId: u.id, rol: u.rol, dataUrl, fecha: nowStamp() };
      if(slot.key === "admin"){
        addBitacora(rec, "Visto bueno del Administrador (firma)." + comentario);
      } else if(slot.key === "cierre"){
        addBitacora(rec, "Cerró la solicitud con observaciones de cierre y firma." + comentario);
        rec.cerrado = true; rec.fechaCierre = nowStamp();
      } else {
        rec.firmaAprobador = u.nombre; rec.firmaAprobadorFecha = todayISO(0);
        addBitacora(rec, "Evaluó la solicitud, la aprobó y firmó." + comentario);
        rec.stage = STAGE_CIERRE; // aprobada: pasa a Cierre
      }
      dbSaveRecord(rec); render();
      if(slot.key !== "admin"){ try { window.location.href = buildMailto(rec); } catch(err){ /* noop */ } } // aviso al siguiente responsable
      setTimeout(() => { const el = document.getElementById("firmas-section"); if(el) el.scrollIntoView({block:"start"}); }, 30);
    });
    app.querySelectorAll("[data-quitarfirma]").forEach(b => b.addEventListener("click", () => {
      const rec = records.find(r=>r.id===S.selectedId);
      const slot = FIRMA_SLOTS.find(sl => sl.key === b.getAttribute("data-quitarfirma"));
      if(!slot || !canSignSlot(rec, slot)) return;
      delete rec.firmas[slot.key];
      addBitacora(rec, `Borró su firma (${slot.label}).`);
      dbSaveRecord(rec); render();
    }));

    // Decisiones del Aprobador autorizado en la etapa de Aprobación
    function motivoObligatorio(){
      const c = document.getElementById("stageComment");
      const v = c ? c.value.trim() : "";
      if(!v){ alert("Escriba el motivo en el campo de comentario."); if(c) c.focus(); }
      return v;
    }
    const btnDevolver = document.getElementById("btnDevolver");
    if(btnDevolver) btnDevolver.addEventListener("click", () => {
      const motivo = motivoObligatorio(); if(!motivo) return;
      const rec = records.find(r=>r.id===S.selectedId);
      addBitacora(rec, "Devuelta al Responsable del proceso para ajustes: " + motivo);
      // Vuelve a la etapa Solicitud: el Responsable del proceso la corrige y la reenvía con una nueva firma.
      rec.stage = STAGE_SOLICITUD; rec.borrador = true; rec.devuelta = true; rec.motivoDevolucion = motivo; rec.guardadoEl = nowStamp();
      delete rec.firmas.sol; delete rec.firmas.aprob; rec.firmaAprobador = ""; rec.firmaAprobadorFecha = "";
      dbSaveRecord(rec); render();
      try { window.location.href = buildMailto(rec); } catch(err){ /* noop */ }
      return;
      dbSaveRecord(rec); render();
    });
    const btnRechazar = document.getElementById("btnRechazar");
    if(btnRechazar) btnRechazar.addEventListener("click", () => {
      const motivo = motivoObligatorio(); if(!motivo) return;
      if(!confirm("¿Confirma que desea rechazar esta solicitud? El registro quedará cerrado como Rechazado.")) return;
      const rec = records.find(r=>r.id===S.selectedId);
      addBitacora(rec, "Solicitud rechazada: " + motivo);
      rec.resultado = "Rechazada"; rec.cerrado = true; rec.fechaCierre = nowStamp();
      dbSaveRecord(rec); render();
    });
    const cumplimientoControl = document.getElementById("cumplimientoControl");
    if(cumplimientoControl) cumplimientoControl.addEventListener("change", e => {
      const rec = records.find(r=>r.id===S.selectedId); rec.cumplimientoControl = e.target.value; dbSaveRecord(rec);
    });
  }

  // Áreas de los Responsables del proceso: agregar, editar (renombrar) y eliminar
  app.querySelectorAll("[data-editarea]").forEach(b => b.addEventListener("click", () => { S.editArea = AREAS[+b.getAttribute("data-editarea")]; render(); }));
  app.querySelectorAll("[data-cancelarea]").forEach(b => b.addEventListener("click", () => { S.editArea = null; render(); }));
  app.querySelectorAll("[data-savearea]").forEach(b => b.addEventListener("click", () => {
    const viejo = AREAS[+b.getAttribute("data-savearea")];
    const nuevo = document.getElementById("editAreaInput").value.trim();
    if(!nuevo){ alert("El nombre del área no puede quedar vacío."); return; }

    if(nuevo !== viejo) renameArea(viejo, nuevo);
    S.editArea = null; render();
  }));
  app.querySelectorAll("[data-delarea]").forEach(b => b.addEventListener("click", () => {
    const a = AREAS[+b.getAttribute("data-delarea")];
    if(records.some(r => r.area === a) || users.some(u => u.area === a)){ alert("No se puede eliminar un área con registros o usuarios asignados."); return; }
    if(!confirm(`¿Eliminar el área "${a}" y sus tipos de desviación?`)) return;
    typesFor(a).forEach(t => dbDeleteType(t.id));
    delete deviationTypes[a];
    AREAS = AREAS.filter(x => x !== a); dbSaveAreas(); render();
  }));
  const addAreaForm = document.getElementById("addAreaForm");
  if(addAreaForm) addAreaForm.addEventListener("submit", e => {
    e.preventDefault();
    const val = document.getElementById("newAreaInput").value.trim();
    if(!val) return;
    if(AREAS.some(a => a.toLowerCase() === val.toLowerCase())){ alert("Esa área ya existe."); return; }
    AREAS.push(val); typesFor(val); dbSaveAreas(); render();
    setTimeout(() => { const el = document.getElementById("areas-card"); if(el) el.scrollIntoView({block:"start"}); }, 30);
  });

  const newUserForm = document.getElementById("newUserForm");
  if(newUserForm){
    newUserForm.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(newUserForm);
      const nu = { id: uid("u"), nombre: String(fd.get("nombre")).trim(), correo: String(fd.get("correo")).trim().toLowerCase(), rol: fd.get("rol"), area: fd.get("area") || "" };
      const err = validateUser(nu);
      if(err){ alert(err); return; }
      const btn = document.getElementById("btnCrearUsuario"); if(btn){ btn.disabled = true; btn.textContent = "Creando acceso…"; }
      const clave = generarClaveTemporal();
      const res = await crearCuentaAcceso(nu.correo, clave, nu.nombre);
      if(!res.ok && !res.yaExiste){ alert("No se pudo crear el acceso: " + res.msg); render(); return; }
      Object.assign(nu, { debeCambiarClave: !!res.ok, authActivo: false, accesoCreado: nowStamp(), creadoPor: currentUser().nombre });
      users.push(nu); dbSaveUser(nu);
      S.shareAccess = { userId: nu.id, nombre: nu.nombre, correo: nu.correo, rol: nu.rol, area: nu.area, clave: res.ok ? clave : "",
        aviso: res.yaExiste ? "Ese correo ya tenía una cuenta de acceso: el usuario debe ingresar con su contraseña actual o usar «¿Olvidó su contraseña?»." : (res.requiereConfirmar ? "Supabase pide confirmar el correo: el usuario recibirá un mensaje de confirmación y debe aceptarlo antes de ingresar (para evitarlo, desactive «Confirm email» en Supabase)." : "") };
      render();
      window.scrollTo && window.scrollTo(0, 0);
      try { window.location.href = mailtoAcceso(S.shareAccess); } catch(err2){ /* noop */ }
    });
  }
  const appUrlForm = document.getElementById("appUrlForm");
  if(appUrlForm) appUrlForm.addEventListener("submit", e => {
    e.preventDefault();

  });
  const btnCerrarShare = document.getElementById("btnCerrarShare");
  if(btnCerrarShare) btnCerrarShare.addEventListener("click", () => {
    if(S.shareAccess && S.shareAccess.clave && !confirm("La contraseña temporal no se volverá a mostrar. ¿Ya la envió al usuario?")) return;
    S.shareAccess = null; render();
  });
  const btnCopiarAcceso = document.getElementById("btnCopiarAcceso");
  if(btnCopiarAcceso) btnCopiarAcceso.addEventListener("click", () => {
    const txt = mensajeAcceso(S.shareAccess);
    const ok = () => { btnCopiarAcceso.textContent = "Copiado ✓"; };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => prompt("Copie los datos de acceso:", txt));

  app.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", () => {
    const u = users.find(x => x.id === b.getAttribute("data-share"));
    S.shareAccess = { userId: u.id, nombre: u.nombre, correo: u.correo, rol: u.rol, area: u.area || "", clave: "" };
    render(); window.scrollTo && window.scrollTo(0, 0);
  }));
  app.querySelectorAll("[data-crearacceso]").forEach(b => b.addEventListener("click", async () => {
    const u = users.find(x => x.id === b.getAttribute("data-crearacceso"));
    if(!confirm(`¿Crear el acceso de ${u.nombre} (${u.correo}) con una contraseña temporal?`)) return;
    b.disabled = true; b.textContent = "Creando…";
    const clave = generarClaveTemporal();
    const res = await crearCuentaAcceso(u.correo, clave, u.nombre);
    if(!res.ok && !res.yaExiste){ alert("No se pudo crear el acceso: " + res.msg); render(); return; }
    Object.assign(u, { debeCambiarClave: !!res.ok, accesoCreado: nowStamp(), creadoPor: currentUser().nombre }); dbSaveUser(u);
    S.shareAccess = { userId: u.id, nombre: u.nombre, correo: u.correo, rol: u.rol, area: u.area || "", clave: res.ok ? clave : "",
      aviso: res.yaExiste ? "Ese correo ya tenía una cuenta de acceso: el usuario debe ingresar con su contraseña actual o usar «¿Olvidó su contraseña?»." : (res.requiereConfirmar ? "Supabase pide confirmar el correo antes del primer ingreso." : "") };
    render(); window.scrollTo && window.scrollTo(0, 0);
    try { window.location.href = mailtoAcceso(S.shareAccess); } catch(err2){ /* noop */ }

  app.querySelectorAll("[data-resetpass]").forEach(b => b.addEventListener("click", async () => {

    alert(err ? "No se pudo enviar: " + err : `Se envió el correo de restablecimiento a ${u.correo}. El enlace lo lleva a la pantalla para crear su nueva contraseña.`);

  app.querySelectorAll("[data-edituser]").forEach(btn => btn.addEventListener("click", () => { S.editUserId = btn.getAttribute("data-edituser"); render(); }));
  app.querySelectorAll("[data-canceluser]").forEach(btn => btn.addEventListener("click", () => { S.editUserId = null; render(); }));
  app.querySelectorAll("[data-saveuser]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-saveuser");
    const u = users.find(x => x.id === id);
    const upd = { ...u,
      nombre: document.getElementById("eu_nombre").value.trim(),
      correo: document.getElementById("eu_correo").value.trim(),
      rol: document.getElementById("eu_rol").value,
      area: document.getElementById("eu_area").value,

    upd.correo = upd.correo.toLowerCase();
    const err = validateUser(upd, id);

      if(!confirm("Cambiar el correo cambia el usuario de ingreso: la cuenta de acceso anterior deja de servir y deberá crear un acceso nuevo para el nuevo correo. ¿Continuar?")) return;
      upd.authActivo = false; upd.accesoCreado = ""; upd.debeCambiarClave = false;
    }
    // Si cambia el nombre, se actualizan los registros que reportó para no perder su seguimiento.
    if(upd.nombre !== u.nombre){
      records.forEach(r => { if(r.reportadoPorId === id || (!r.reportadoPorId && r.reportadoPor === u.nombre)){ r.reportadoPor = upd.nombre; r.reportadoPorId = id; dbSaveRecord(r); } });
    }
    Object.assign(u, upd); dbSaveUser(u);
    S.editUserId = null; render();
  }));
  app.querySelectorAll("[data-deluser]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-deluser");

    if(id === S.currentUserId){ alert("No puede eliminar su propio usuario mientras tiene la sesión abierta."); return; }
    if(!confirm(`¿Eliminar al usuario ${u.nombre}? Sus registros y firmas existentes se conservan y ya no podrá ingresar al aplicativo.`)) return;
    users = users.filter(x => x.id !== id); dbDeleteUserRemote(id);

    render();

  app.querySelectorAll("[data-restore]").forEach(b => b.addEventListener("click", () => {

  app.querySelectorAll("[data-addtype]").forEach(form => form.addEventListener("submit", e => {

  }));
  app.querySelectorAll("[data-deltype]").forEach(btn => btn.addEventListener("click", () => {

  }));
}

// Cambia el nombre de un área en todo el aplicativo: lista de áreas, registros, usuarios y tipos de desviación.
function renameArea(viejo, nuevo){
  AREAS = AREAS.map(a => a === viejo ? nuevo : a);
  deviationTypes[nuevo] = typesFor(viejo); delete deviationTypes[viejo];
  deviationTypes[nuevo].forEach(t => dbSaveType(nuevo, t));
  records.forEach(r => { if(r.area === viejo){ r.area = nuevo; r.bitacora.push({ etapa: STAGES[r.stage], rol: currentUser().rol, usuario: currentUser().nombre, fecha: todayISO(0), comentario: `Área renombrada de "${viejo}" a "${nuevo}".` }); dbSaveRecord(r); } });
  users.forEach(u => { if(u.area === viejo){ u.area = nuevo; dbSaveUser(u); } });
  if(S.fArea === viejo) S.fArea = nuevo;
  dbSaveAreas();
}
function validateUser(u, editingId){
  if(!u.nombre) return "El nombre es obligatorio.";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u.correo)) return "Escriba un correo electrónico válido.";
  if(users.some(x => x.id !== editingId && x.correo.toLowerCase() === u.correo.toLowerCase())) return "Ya existe un usuario con ese correo.";
  if(ROLE_AREA_REQUIRED.includes(u.rol) && !u.area) return `El rol "${u.rol}" requiere un área asignada.`;
  if(editingId){
    const before = users.find(x => x.id === editingId);
    if(before.rol === "Administrador" && u.rol !== "Administrador" && users.filter(x => x.rol === "Administrador").length <= 1) return "Debe existir al menos un Administrador: asigne ese rol a otra persona antes de cambiar este.";
  }
  return "";
}

function renderListOnly(){
  document.querySelector(".content").innerHTML = renderList();
  bindGlobalEvents();
  const si = document.getElementById("searchInput");
  if(si){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
}

function clearSignaturesFrom(rec, stage){
  FIRMA_SLOTS.forEach(sl => { if(sl.stage !== null && sl.stage >= stage && sl.key !== "sol") delete rec.firmas[sl.key]; });
  if(stage <= STAGE_APROBACION){ rec.firmaAprobador = ""; rec.firmaAprobadorFecha = ""; }
}
// Solo para el Administrador: retroceder una etapa (corrección). Anula las firmas desde la etapa a la que vuelve.
function stageMove(id, delta){
  const rec = records.find(r=>r.id===id);
  if(delta >= 0 || !isAdmin() || isClosed(rec) || rec.stage !== STAGE_CIERRE) return;
  const commentBox = document.getElementById("stageComment");
  const fromStage = rec.stage;
  rec.stage = rec.stage - 1;
  clearSignaturesFrom(rec, rec.stage);
  const comentario = ((commentBox && commentBox.value.trim()) || "Etapa retrocedida por el Administrador.") + " Se anulan las firmas desde la etapa " + STAGES[rec.stage] + " para volver a aprobarlas.";
  rec.bitacora.push({ etapa: STAGES[fromStage], rol: currentUser().rol, usuario: currentUser().nombre, fecha: todayISO(0), comentario });
  dbSaveRecord(rec);
  render();
}

// Lee el formulario "Nuevo registro" y arma los campos del registro (sin validar).
function datosDelFormulario(form){
  const fd = new FormData(form);
  const u = currentUser();
  const tipoGestion = fd.get("tipoGestion");
  const d8 = emptyD8();
  if(tipoGestion === "Derogación"){
    D8_FIELDS.forEach(f => { d8[f.key] = fd.get(`d8_${f.key}`) || ""; });
    W2H_FIELDS.forEach(w => { d8.w2h[w.key] = fd.get(`d8_w2h_${w.key}`) || ""; });
    d8.whys = Array.from({length: WHYS_COUNT}, (_, i) => fd.get(`d8_why_${i}`) || "");
    ["d3","d5"].forEach(kind => {
      const cfg = ACT_TABLES[kind];
      const filas = draftActs[kind].filter(r => cfg.cols.some(c => String(r[c.key]||"").trim())).map(r => Object.assign({}, r));
      d8[cfg.prop] = filas.length ? filas : [emptyActRow(kind)];
    });
  }
  const temaSel = fd.get("tema") || fd.get("area") || "";
  const temaOtro = temaSel === OTRO;
  const tema = temaOtro ? String(fd.get("temaOtro") || "").trim() : temaSel;
  const tipoSel = fd.get("tipoEspecifico") || "";
  const tipoEspecificoOtro = tipoSel === OTRO;
  const tipoEspecifico = tipoEspecificoOtro ? String(fd.get("tipoEspecificoOtro") || "").trim() : tipoSel;
  const relacionadoSST = tema === AREA_SST || (fd.get("area") || "") === AREA_SST;
  const alcanceDerogacion = tipoGestion === "Derogación" ? (fd.get("alcanceDerogacion") || "Temporal") : "";
  const definitiva = alcanceDerogacion === "Definitiva";
  const fechaEfectiva = definitiva ? (fd.get("fechaEfectiva") || "") : "";
  return {
    modelo: MODELO_REGISTRO,
    fechaHora: fd.get("fechaHora") || "", area: fd.get("area") || "", tema, temaOtro, tipoGestion,
    tipoEspecifico, tipoEspecificoOtro, reportadoPor: fd.get("reportadoPor") || u.nombre, reportadoPorId: u.id,
    cargo: fd.get("cargo") || "", areaSolicitante: fd.get("areaSolicitante") || "", procesoSolicitante: fd.get("procesoSolicitante") || "",
    responsableProcesoId: u.id, responsableProceso: fd.get("reportadoPor") || u.nombre,
    ot: fd.get("ot") || "", proyecto: fd.get("proyecto") || "", lineaNegocio: fd.get("lineaNegocio") || "",
    relacionadoSST, peligroSST: relacionadoSST && !tipoEspecificoOtro ? tipoEspecifico : "",
    condicionSeguridad: relacionadoSST ? (fd.get("condicionSeguridad") || "") : "",
    criticidad: fd.get("criticidad") || "", recurrente: fd.get("recurrente") === "on",
    controlesCompensatorios: fd.get("controlesCompensatorios") || "",
    alcanceDerogacion, fechaEfectiva,
    vigenciaInicio: definitiva ? fechaEfectiva : (fd.get("vigenciaInicio") || ""), vigenciaFin: definitiva ? "" : (fd.get("vigenciaFin") || ""),
    requisitoIncumplido: fd.get("requisitoIncumplido") || "", equipoInvolucrado: fd.get("equipoInvolucrado") || "",
    tareaDescripcion: fd.get("tareaDescripcion") || "", motivoDesviacion: fd.get("motivoDesviacion") || "",
    consecuenciasPotenciales: fd.get("consecuenciasPotenciales") || "",
    eppAdicional: relacionadoSST ? (fd.get("eppAdicional") || "") : "", procedimientosAlternativos: relacionadoSST ? (fd.get("procedimientosAlternativos") || "") : "",
    companeroApoyo: relacionadoSST ? (fd.get("companeroApoyo") || "") : "",
    adjuntos: draftAdjuntos.slice(), d8Started: tipoGestion === "Derogación", d8,
  };
}
// Valida el tema/tipo escritos y las fechas de la derogación (temporal: rango; definitiva: fecha efectiva).
function validarVigencia(d){
  if(d.temaOtro && !d.tema) return "Escriba el tema de la solicitud (opción \"Otro\").";
  if(d.tipoEspecificoOtro && !d.tipoEspecifico) return "Escriba el tipo específico de desviación o derogación (opción \"Otro\").";
  if(d.tipoGestion === "Derogación"){
    if(d.alcanceDerogacion === "Definitiva"){ if(!d.fechaEfectiva) return "Indique la fecha a partir de la cual la derogación será efectiva de forma permanente."; }
    else {
      if(!d.vigenciaInicio || !d.vigenciaFin) return "Indique el rango de fechas (desde y hasta) de la derogación temporal.";
      if(d.vigenciaFin < d.vigenciaInicio) return "La fecha final de la derogación temporal no puede ser anterior a la fecha inicial.";
    }
  } else if(d.vigenciaInicio && d.vigenciaFin && d.vigenciaFin < d.vigenciaInicio) return "La fecha final de la vigencia no puede ser anterior a la fecha inicial.";
  return "";
}
// Guarda el avance del formulario como borrador (sin firma ni validaciones) para terminarlo después.
function guardarBorrador(form){
  const u = currentUser();
  const existente = S.editDraftId ? records.find(r => r.id === S.editDraftId) : null;
  const datos = datosDelFormulario(form);
  let rec;
  if(existente){
    rec = Object.assign(existente, datos, { borrador: true, guardadoEl: nowStamp() });
  } else {
    rec = normalizeRecord(Object.assign(datos, {
      id: "BOR-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      borrador: true, devuelta: false, stage: STAGE_SOLICITUD, guardadoEl: nowStamp(),
      conceptoEvaluacion: "", observacionesAprobacion: "", observacionesCierre: "", cumplimientoControl: "",
      resultado: "", cerrado: false, fechaCierre: "", firmas: {}, notificacionEnviada: false,
      bitacora: [{ etapa: STAGES[0], rol: u.rol, usuario: u.nombre, fecha: todayISO(0), comentario: "Borrador creado." }],
    }));
    records.unshift(rec);
  }
  dbSaveRecord(rec);
  S.editDraftId = rec.id; S.populateDraft = true; // se vuelve a mostrar el formulario con lo guardado
  S.draftSavedMsg = `Avance guardado (${rec.guardadoEl}). Puede continuarlo después desde "Nuevo registro". La firma se pide solo al enviar.`;
  render();
  window.scrollTo && window.scrollTo(0, 0);
}
function abrirBorrador(id){
  const d = records.find(r => r.id === id);
  if(!d) return;
  S.editDraftId = id; S.populateDraft = true; S.draftSavedMsg = ""; S.view = "new"; S.selectedId = null;
  draftAdjuntos = (d.adjuntos || []).slice();
  draftActs = {
    d3: (d.d8 && d.d8.contencion && d.d8.contencion.length ? d.d8.contencion : [emptyActRow("d3")]).map(r => Object.assign({}, r)),
    d5: (d.d8 && d.d8.correctivas && d.d8.correctivas.length ? d.d8.correctivas : [emptyActRow("d5")]).map(r => Object.assign({}, r)),
  };
  render();
}
// Rellena el formulario con lo guardado en el borrador (o en la solicitud devuelta).
function populateFormFromDraft(form, d){
  const set = (name, val) => { const el = form.querySelector(`[name="${name}"]`); if(el && val !== undefined && val !== null) el.value = val; };
  const fire = (id) => { const el = document.getElementById(id); if(el) el.dispatchEvent(new Event("change", {bubbles:true})); };
  ["fechaHora","reportadoPor","cargo","areaSolicitante","procesoSolicitante","ot","proyecto","lineaNegocio",
   "requisitoIncumplido","equipoInvolucrado","tareaDescripcion","motivoDesviacion","consecuenciasPotenciales","controlesCompensatorios",
   "vigenciaInicio","vigenciaFin","eppAdicional","procedimientosAlternativos","companeroApoyo"].forEach(k => set(k, d[k]));
  if(d.area && AREAS.includes(d.area)){ set("area", d.area); fire("areaSelect"); }
  // "Solicitud relacionada con temas de": opción de la lista o texto escrito por el usuario
  if(d.tema){
    if(!d.temaOtro && AREAS.includes(d.tema)) set("tema", d.tema);
    else { set("tema", OTRO); set("temaOtro", d.tema); }
    fire("temaSelect");
  }
  if(d.tipoEspecifico){
    const sel = form.querySelector('[name="tipoEspecifico"]');
    const existe = sel && Array.from(sel.options).some(o => o.value === d.tipoEspecifico);
    if(existe && !d.tipoEspecificoOtro) set("tipoEspecifico", d.tipoEspecifico);
    else { set("tipoEspecifico", OTRO); set("tipoEspecificoOtro", d.tipoEspecifico); }
    fire("tipoEspecificoSelect");
  }
  if(d.condicionSeguridad) set("condicionSeguridad", d.condicionSeguridad);
  if(d.tipoGestion === "Derogación"){
    const radio = form.querySelector(`[name="alcanceDerogacion"][value="${d.alcanceDerogacion === "Definitiva" ? "Definitiva" : "Temporal"}"]`);
    if(radio) radio.checked = true;
    if(d.fechaEfectiva) set("fechaEfectiva", d.fechaEfectiva);
  }
  if(d.tipoGestion){ set("tipoGestion", d.tipoGestion); fire("tipoGestionSelect"); }
  if(d.criticidad) set("criticidad", d.criticidad);
  const rec = form.querySelector('[name="recurrente"]'); if(rec) rec.checked = !!d.recurrente;
  if(d.tipoGestion === "Derogación" && d.d8){
    D8_FIELDS.forEach(f => set(`d8_${f.key}`, d.d8[f.key]));
    W2H_FIELDS.forEach(w => set(`d8_w2h_${w.key}`, d.d8.w2h ? d.d8.w2h[w.key] : ""));
    (d.d8.whys || []).forEach((q, i) => set(`d8_why_${i}`, q));
  }
}
function handleCreateRecord(e){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const firmaSolicitante = fd.get("firmaSolicitante") || "";
  if(!firmaSolicitante){
    alert("Por favor dibuje su firma en el recuadro antes de enviar la solicitud.");
    return;
  }
  const u = currentUser();
  const datos = datosDelFormulario(form);
  const errVig = validarVigencia(datos);
  if(errVig){ alert(errVig); return; }
  const existente = S.editDraftId ? records.find(r => r.id === S.editDraftId) : null;
  const id = existente && !isBorradorTemporal(existente) ? existente.id : nextRecordId();
  const bitacoraPrev = existente ? existente.bitacora.filter(b => b.comentario !== "Borrador creado.") : [];
  const rec = normalizeRecord(Object.assign({}, existente || {}, datos, {
    id, borrador: false, devuelta: false, motivoDevolucion: existente ? (existente.motivoDevolucion || "") : "",
    stage: STAGE_EVAL, // la Solicitud queda aprobada con la firma del Responsable del proceso; pasa a Evaluación y Aprobación
    conceptoEvaluacion: existente ? (existente.conceptoEvaluacion || "") : "", observacionesAprobacion: existente ? (existente.observacionesAprobacion || "") : "",
    observacionesCierre: "", cumplimientoControl: "", resultado: "", cerrado: false, fechaCierre: "",
    firmaSolicitante, firmaSolicitanteFecha: nowStamp(), firmaAprobador: "", firmaAprobadorFecha: "",
    firmas: { sol: { nombre: datos.reportadoPor, usuarioId: u.id, rol: u.rol, dataUrl: firmaSolicitante, fecha: nowStamp() } },
    notificacionEnviada: false,
    bitacora: bitacoraPrev.concat([{ etapa: STAGES[0], rol: u.rol, usuario: u.nombre, fecha: todayISO(0),
      comentario: (existente && existente.devuelta ? "Solicitud ajustada y reenviada con firma." : "Solicitud creada y firmada.") + (datos.adjuntos.length ? ` ${datos.adjuntos.length} archivo(s) adjunto(s).` : "") }]),
  }));
  if(existente){
    records = records.filter(r => r.id !== existente.id);
    if(existente.id !== id) dbDeleteRecord(existente.id);
  }
  records.unshift(rec);
  dbSaveRecord(rec);
  draftAdjuntos = [];
  draftActs = { d3: [emptyActRow("d3")], d5: [emptyActRow("d5")] };
  S.editDraftId = null; S.draftSavedMsg = "";
  S.createdId = rec.id; S.selectedId = null; S.view = "created";
  render();
  try { window.location.href = buildMailto(rec); } catch(err){ /* noop */ }
}

/* ============================================================
   HISTÓRICO EN EXCEL
   ============================================================ */
function estadoTexto(r){
  if(r.resultado === "Rechazada") return "Rechazada";
  if(isClosed(r)) return "Cerrada";
  if(r.devuelta) return "Devuelta para ajustes";
  return STAGES[r.stage] || "";
}
function descargarHistoricoExcel(){
  const regs = visibleRecords().filter(r => !r.borrador || r.devuelta).slice().sort((a,b) => String(a.id).localeCompare(String(b.id)));
  const f = (r, k) => { const x = r.firmas && r.firmas[k]; return x ? x : null; };
  const filas = regs.map(r => ({
    "Consecutivo": r.id, "Estado": estadoTexto(r), "Etapa": STAGES[r.stage] || "",
    "Fecha y hora de solicitud": (r.fechaHora || "").replace("T"," "),
    "Responsable del proceso (solicitante)": r.reportadoPor, "Cargo": r.cargo, "Área (organigrama)": r.areaSolicitante, "Proceso": r.procesoSolicitante,
    "Dirigida al área de": r.area, "Relacionada con temas de": r.tema || r.area, "Tipo específico de desviación o derogación": r.tipoEspecifico,
    "Clasificación GTC 45": r.condicionSeguridad || "", "OT": r.ot, "Proyecto": r.proyecto, "Línea de negocio": r.lineaNegocio,
    "Figura": r.tipoGestion, "Criticidad": r.criticidad, "Recurrente": r.recurrente ? "Sí" : "No",
    "Alcance de la derogación": r.alcanceDerogacion || (r.tipoGestion === "Derogación" ? "Temporal" : "No aplica"),
    "Vigencia inicio": esDefinitiva(r) ? "" : r.vigenciaInicio, "Vigencia fin": esDefinitiva(r) ? "" : r.vigenciaFin, "Fecha efectiva (definitiva)": esDefinitiva(r) ? r.fechaEfectiva : "",
    "Requisito incumplido": r.requisitoIncumplido, "Motivo": r.motivoDesviacion, "Consecuencias potenciales": r.consecuenciasPotenciales,
    "Medidas de control": r.controlesCompensatorios, "Concepto de evaluación": r.conceptoEvaluacion, "Observaciones de aprobación": r.observacionesAprobacion,
    "Aprobado por": f(r,"aprob") ? f(r,"aprob").nombre : "", "Fecha de aprobación": f(r,"aprob") ? f(r,"aprob").fecha : "",
    "Observaciones de cierre": r.observacionesCierre, "Cumplimiento de controles": r.cumplimientoControl,
    "Cerrado por": f(r,"cierre") ? f(r,"cierre").nombre : "", "Fecha de cierre": r.fechaCierre,
    "8D completo": r.tipoGestion === "Derogación" ? (is8DComplete(r) ? "Sí" : "No") : "No aplica",
    "Archivos adjuntos": (r.adjuntos || []).length,
  }));
  const bit = []; regs.forEach(r => (r.bitacora || []).forEach(b => bit.push({ "Consecutivo": r.id, "Fecha": b.fecha, "Etapa": b.etapa, "Rol": b.rol, "Usuario": b.usuario, "Comentario": b.comentario })));
  const acc = []; regs.filter(r => r.tipoGestion === "Derogación").forEach(r => {
    (r.d8.contencion || []).filter(a => a.accion || a.puntoControl).forEach(a => acc.push({ "Consecutivo": r.id, "Tipo": "Contención (D3)", "Causa": "", "Acción": a.accion, "Punto de control": a.puntoControl, "Fecha de realización": a.fecha, "Responsable": a.responsable }));
    (r.d8.correctivas || []).filter(a => a.causa || a.accion).forEach(a => acc.push({ "Consecutivo": r.id, "Tipo": "Correctiva (D5)", "Causa": a.causa, "Acción": a.accion, "Punto de control": "", "Fecha de realización": a.fecha, "Responsable": a.responsable }));
  });
  const nombre = "Historico_Desviaciones_MATEC_" + todayISO(0);
  if(!filas.length){ alert("No hay registros para descargar."); return; }
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const hoja = (rows, nombreHoja) => {
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "Sin datos": "" }]);
      const cols = Object.keys(rows[0] || { "Sin datos": "" });
      ws["!cols"] = cols.map(c => ({ wch: Math.min(60, Math.max(c.length + 2, ...rows.map(x => String(x[c] ?? "").length).slice(0, 200).map(n => Math.min(n, 60)))) }));
      ws["!autofilter"] = { ref: ws["!ref"] };
      XLSX.utils.book_append_sheet(wb, ws, nombreHoja);
    };
    hoja(filas, "Registros"); hoja(bit, "Bitácora"); hoja(acc, "Acciones 8D");
    if(isAdmin()) hoja(eliminados.map(h => ({ "Fecha": h.fecha, "Consecutivo": h.registroId, "Figura": h.tipoGestion, "Tipo específico": h.tipoEspecifico, "Área": h.area, "Estado al eliminar": h.estado,
      "Eliminado por": h.eliminadoPor, "Rol": h.rol, "Correo": h.eliminadoPorCorreo, "Motivo": h.motivo, "Restaurado": h.restaurado ? `Sí (${h.restauradoPor}, ${h.restauradoEl})` : "No" })), "Eliminados");
    XLSX.writeFile(wb, nombre + ".xlsx");
  } else {
    // Sin conexión a internet: se descarga en CSV (se abre en Excel).
    const cols = Object.keys(filas[0]);
    const csv = "﻿" + [cols.join(";")].concat(filas.map(r => cols.map(c => '"' + String(r[c] ?? "").replace(/"/g,'""').replace(/\r?\n/g," ") + '"').join(";"))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    a.download = nombre + ".csv"; document.body.appendChild(a); a.click(); a.remove();
    alert("No se pudo cargar el generador de Excel (requiere internet). Se descargó el histórico en formato CSV, que también se abre con Excel.");
  }
}

if (AUTH_ON) { initAuth(); }
else { S.authCargando = false; render(); if (DB_ENABLED) { dbLoadAll(); } }
