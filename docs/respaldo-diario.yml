# PLANTILLA del respaldo diario de la base de datos y de los archivos.
# Para activarla hay que copiar este archivo a .github/workflows/respaldo.yml (ver docs/RESPALDOS.md).
# Qué hace: copia la base de datos y los archivos nuevos, los cifra y los guarda en un segundo
# repositorio privado. También sirve para que Supabase gratis no se pause por falta de uso.
# Configuración (una sola vez) y cómo restaurar: ver docs/RESPALDOS.md
name: Respaldo diario

on:
  schedule:
    - cron: "17 7 * * *"   # 2:17 a. m. en Colombia
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar las herramientas
        run: |
          npm ci
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Traer el repositorio de respaldos
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: respaldos

      - name: Copia de la base de datos (cifrada)
        run: |
          FECHA=$(TZ=America/Bogota date +%F)
          mkdir -p /tmp/base respaldos/base
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public -f /tmp/base/public.sql
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --schema=auth --table=auth.users --table=auth.identities -f /tmp/base/auth.sql
          tar czf /tmp/base.tar.gz -C /tmp/base public.sql auth.sql
          node scripts/respaldo.mjs cifrar /tmp/base.tar.gz "respaldos/base/base-$FECHA.tar.gz.cif"

      - name: Copia de los archivos nuevos (cifrados)
        run: node scripts/respaldo.mjs archivos respaldos

      - name: Borrar copias de la base de datos con más de 90 días
        run: |
          CORTE=$(date -d '90 days ago' +%F)
          for f in respaldos/base/base-*.tar.gz.cif; do
            d=${f##*/base-}; d=${d%%.tar.gz.cif}
            if [[ "$d" < "$CORTE" ]]; then rm -f "$f"; fi
          done

      - name: Guardar en el repositorio de respaldos
        working-directory: respaldos
        run: |
          git config user.name "Respaldo automático"
          git config user.email "respaldo@users.noreply.github.com"
          git add -A
          git commit -m "Respaldo $(TZ=America/Bogota date +%F)" || echo "No hubo cambios"
          git push
